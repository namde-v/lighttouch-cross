# LightTouch cross-platform port — Windows packaging
#
# Assembles the portable Windows ZIP from CI artifacts. Intended layout:
#
#   LightTouch/
#     LightTouch.exe            Qt 6 UI executable (from the windows-qt-ci
#                               run resolved by Gap 2 below; absent when no
#                               successful qt-ci run exists for the branch)
#     qemu-system-arm.exe       from the windows-emulator-ci artifact
#     *.dll                     MinGW runtime DLLs (bundled by the emulator job)
#     *.dll                     Swift package DLLs (from windows-ci artifacts)
#     swiftCore.dll, ...        Swift runtime DLLs (copied from the toolchain)
#     README.txt                contents manifest (generated: run id, per-package
#                               DLL counts, qemu/Qt presence — a degraded ZIP
#                               says so instead of passing silently)
#
# The layout is FLAT (no bin/ or lib/ subdirs): the Windows loader does not
# search subdirectories for DLLs, so a flat directory is the only portable
# layout that works without a launcher shim or PATH manipulation.
#
# Trigger: workflow_dispatch, plus a push self-validation run whenever this
# file itself changes (so edits here are exercised without a dispatch).
# Run selection: an explicit run id is validated; otherwise the newest
# COMPLETED windows-ci run on main that actually uploaded build artifacts
# is used. windows-ci has never gone fully green, so requiring a SUCCESS
# run made the default path unresolvable — test failures do NOT disqualify
# a run (build artifacts upload with if: always()), but a run whose builds
# failed (no artifacts) is skipped. A ZIP with zero package DLLs fails loudly.
#
# Gap 2 (implemented): the Qt exe comes from windows-qt-ci runs, resolved
# by the qt-run-id step (SHA-matched successful run on the same branch,
# else newest successful run on the branch + warning, else no exe). The
# installer picks the exe up from the ZIP automatically. Gap 3 (first
# commit): windeployqt stages the Qt runtime (DLLs + plugins) next to
# the exe; the exe's QML is embedded (qrc), so no qml/ staging is needed,
# and Swift core DLLs were already staged. Still open: the cross-repo
# trigger so lighttouch-ui pushes run qt-ci (gap 5).
name: Windows package

on:
  # The paths push trigger exists so the workflow is registered with GitHub
  # (a workflow_dispatch-only file that has never run cannot be dispatched
  # by name) and self-validates when edited. It only fires on this file.
  push:
    branches: [main, port/**, win/**]
    paths:
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:
    inputs:
      windows_ci_run_id:
        description: "Windows CI run id to package (default: latest completed run on main with build artifacts)"
        required: false
        default: "latest"

permissions:
  contents: read
  actions: read

# NOTE: no SWIFT_VERSION env here on purpose. The toolchain is installed by
# compnerd/gha-setup-swift below at swift-6.2.4-release, matching windows-ci
# (which carries a stale 6.4.1 env var of its own with an explanatory
# comment). A second version label in this file only confused readers.

jobs:
  package:
    name: Assemble portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # QtUI sources are needed only as windeployqt's --qmldir input (the
      # QML import scan); the exe itself embeds its QML via resources
      # (qrc:/qml/main.qml), so no qml/ files are staged into the ZIP.
      - name: Check out Qt UI repo (windeployqt qmldir)
        uses: actions/checkout@v4
        with:
          repository: namde-v/lighttouch-ui
          path: QtUI

      # Only needed as the source of the Swift runtime DLLs (swiftCore.dll,
      # ...); nothing is compiled in this job.
      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE

      # Qt install for windeployqt: must match the Qt that built the exe
      # (6.8.3 msvc2022_64, qtmultimedia for CaptureSounds) — same
      # coordinates as windows-qt-ci.yml. Installed, not downloaded from
      # artifacts: no workflow publishes the Qt runtime DLLs.
      - name: Install Qt (windeployqt)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia"
          cache: true

      - name: Resolve Windows CI run id
        id: run-id
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.windows_ci_run_id }}
        run: |
          # Explicit id (dispatch only): validate it is a windows-ci run.
          # Empty or 'latest' (push runs carry no inputs): pick the newest
          # COMPLETED windows-ci run on main that uploaded ALL EIGHT
          # swift-<pkg>-windows-x86_64 build artifacts. Test failures do
          # NOT disqualify a run — build artifacts upload with if: always()
          # — but a run whose builds failed (missing artifacts) is skipped.
          # WHY ALL EIGHT + COMPLETED (post-merge run 40197207503 failed):
          # the old filter `select(.conclusion != null)` does NOT exclude
          # in-progress runs — gh emits an EMPTY-STRING conclusion, not
          # JSON null, for unfinished runs (log: "Skipping run 40197207466
          # (conclusion: , no build artifacts)"), and the old "at least
          # one build artifact" bar let the still-running run 40196082917
          # (5/7 artifacts uploaded, LTC + FirmwareKit jobs unfinished)
          # through. Packaging from a partial run then failed at download.
          # --status completed is server-side; the all-eight check is the
          # belt-and-braces guard against partial-artifact runs.
          $inputId = "$env:INPUT_RUN_ID".Trim()
          if ($inputId -and $inputId -ne 'latest') {
            # NOTE: gh run view's workflowName is the display name ('Windows'
            # for windows-ci.yml), NOT the file name — the old check rejected
            # every real windows-ci run (manual dispatch 40111942823 failed on
            # exactly this). Validate via the API's path field instead.
            $view = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$inputId" --jq '"\(.id) \(.path) \(.head_sha) \(.head_branch)"' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $view) { Write-Error "Run id $inputId not found or not readable"; exit 1 }
            $parts = $view -split '\s+'
            if ($parts[1] -ne '.github/workflows/windows-ci.yml') { Write-Error "Run $inputId is workflow '$($parts[1])', not windows-ci"; exit 1 }
            $id = $parts[0]; $headSha = $parts[2]; $headBranch = $parts[3]
            Write-Host "Packaging explicit windows-ci run $id"
          } else {
            $lines = @(gh run list --workflow windows-ci.yml --branch main --status completed --limit 20 --json databaseId,conclusion,headSha,headBranch --jq '.[] | "\(.databaseId) \(.headSha) \(.conclusion) \(.headBranch)"')
            $id = $null; $headSha = $null; $headBranch = $null
            $pkgs = @('HostRuntime','DeviceServices','ReleaseChecks','BuildTools','FirmwareKit','DeviceRuntime','LightTouchCore','LTAppCore')
            foreach ($line in $lines) {
              $parts = $line -split '\s+'
              $candId = $parts[0]; $candSha = $parts[1]; $candConcl = $parts[2]
              $names = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$candId/artifacts" --paginate --jq '.artifacts[].name' 2>$null
              $missing = @($pkgs | Where-Object { $names -notcontains "swift-$_-windows-x86_64" })
              if (-not $missing) { $id = $candId; $headSha = $candSha; $headBranch = $parts[3]; break }
              Write-Host "Skipping run $candId (conclusion: $candConcl, missing build artifacts: $($missing -join ', '))"
            }
            if (-not $id) { Write-Error 'No completed windows-ci run on main with build artifacts found'; exit 1 }
            Write-Host "Packaging artifacts from windows-ci run $id (head $headSha)"
          }
          "run_id=$id" >> $env:GITHUB_OUTPUT
          "head_sha=$headSha" >> $env:GITHUB_OUTPUT
          "head_branch=$headBranch" >> $env:GITHUB_OUTPUT

      # Gap 2 (main-agent decision 2026-10-26): the Qt exe artifact lives
      # on windows-qt-ci runs, NEVER on the windows-ci run id above — so
      # the Qt step must resolve its own run id. Primary: newest
      # SUCCESSFUL windows-qt-ci run on the same branch whose head SHA
      # equals the packaged commit. Fallback: newest successful
      # windows-qt-ci run on the same branch + warning. Neither: empty
      # output, and the Qt step keeps the warn-and-continue behavior.
      # Success is required in both cases: a qt-ci run with red tests
      # must not contribute its exe. Artifact presence is also required:
      # scaffold-era successful qt-ci runs on main (e.g. 39113095570)
      # carry no lighttouch-qt-ui-windows-x86_64 artifact at all, and
      # selecting one only produces a misleading download warning.
      - name: Resolve Qt UI run id (Gap 2)
        id: qt-run-id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $targetSha = "${{ steps.run-id.outputs.head_sha }}"
          $branch = "${{ steps.run-id.outputs.head_branch }}"
          $lines = @(gh run list --workflow windows-qt-ci.yml --branch $branch --status completed --limit 20 --json databaseId,headSha,conclusion --jq '.[] | "\(.databaseId) \(.headSha) \(.conclusion)"')
          function Has-QtArtifact($runId) {
            $names = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts" --jq '.artifacts[].name' 2>$null
            return ($names -contains 'lighttouch-qt-ui-windows-x86_64')
          }
          $qtId = $null
          foreach ($line in $lines) {
            $parts = $line -split '\s+'
            if ($parts[1] -eq $targetSha -and $parts[2] -eq 'success' -and (Has-QtArtifact $parts[0])) { $qtId = $parts[0]; break }
          }
          if ($qtId) {
            Write-Host "Qt exe from SHA-matched windows-qt-ci run $qtId (head $targetSha, branch $branch)"
          } else {
            foreach ($line in $lines) {
              $parts = $line -split '\s+'
              if ($parts[2] -eq 'success' -and (Has-QtArtifact $parts[0])) {
                $qtId = $parts[0]
                Write-Warning "No windows-qt-ci run matches head $targetSha on $branch; using newest successful run $qtId (head $($parts[1])) — exe may not match the packaged commit"
                break
              }
            }
            if (-not $qtId) { Write-Warning "No successful windows-qt-ci run with the Qt artifact on $branch; continuing without LightTouch.exe" }
          }
          if ($qtId) { "qt_run_id=$qtId" >> $env:GITHUB_OUTPUT }

      - name: Download Swift package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Named downloads only: the blanket `gh run download` also pulls
          # swift-*-windows-x86_64-logs artifacts, which on crash runs hold
          # 250MB+ .dmp files. A missing per-package artifact only warns
          # (that job's build failed); the assemble step fails if NO package
          # DLLs were staged at all. NOTE: the trailing `$LASTEXITCODE = 0`
          # is load-bearing, not cosmetic — pwsh propagates the final
          # native exit code, so without it a failed LAST download
          # (LightTouchDevice, now last in the list) failed the whole step in
          # post-merge run 40197207503 despite the warn-only intent.
          foreach ($pkg in @('HostRuntime','DeviceServices','ReleaseChecks','BuildTools','FirmwareKit','DeviceRuntime','LightTouchCore','LTAppCore','LightTouchDevice')) {
            gh run download ${{ steps.run-id.outputs.run_id }} --name "swift-$pkg-windows-x86_64" --dir "swift-artifacts/swift-$pkg-windows-x86_64"
            if ($LASTEXITCODE -eq 0) { Write-Host "artifact: swift-$pkg-windows-x86_64" } else { Write-Warning "build artifact missing for $pkg" }
          }
          $LASTEXITCODE = 0

      # The emulator workflow only runs when its own file changes, so a
      # successful run may not exist yet — warn and continue without qemu.
      - name: Download emulator artifact (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = gh run list --workflow windows-emulator-ci.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $id) { Write-Warning 'No successful windows-emulator-ci run found; qemu-system-arm.exe will be missing from the ZIP'; exit 1 }
          gh run download $id --name qemu-system-arm-windows-x86_64 --dir qemu-artifact

      # Gap 2: fetch from the windows-qt-ci run resolved above, NOT from
      # the windows-ci run id (a windows-ci run never contains the Qt
      # artifact). No resolved id -> warn and continue without the exe.
      - name: Download Qt UI executable (Gap 2)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $qtId = "${{ steps.qt-run-id.outputs.qt_run_id }}"
          if (-not $qtId) { Write-Warning 'No windows-qt-ci run resolved; continuing without LightTouch.exe'; exit 1 }
          gh run download $qtId --name lighttouch-qt-ui-windows-x86_64 --dir qt-artifact
          if (-not (Test-Path qt-artifact/LightTouch.exe)) { Write-Warning "Qt UI artifact from run $qtId has no LightTouch.exe"; exit 1 }

      - name: Assemble portable layout
        run: |
          $layout = 'LightTouch'
          New-Item -ItemType Directory -Force -Path $layout | Out-Null

          # Swift package DLLs / import libs / executables from windows-ci
          Get-ChildItem swift-artifacts -Recurse -Include *.dll,*.exe | Copy-Item -Destination $layout -Force
          $pkgDllCount = @(Get-ChildItem swift-artifacts -Recurse -Filter *.dll).Count
          Write-Host "Swift package DLLs staged: $pkgDllCount"
          if ($pkgDllCount -eq 0) { Write-Error 'No Swift package DLLs staged — refusing to ship an empty ZIP'; exit 1 }

          # firmwarekit.exe (device preparation): staged from the windows-ci
          # FirmwareKit artifact by the *.exe glob above, once windows-ci
          # builds it (FirmwareKit/Package.swift includes the executable on
          # Windows). Warn-only, like qemu below: the app launches without
          # it; it only gates device preparation (FirmwareJobs.canDownload).
          if (Test-Path (Join-Path $layout 'firmwarekit.exe')) { Write-Host 'Staged firmwarekit.exe (device preparation)' } else { Write-Warning 'firmwarekit.exe not staged (windows-ci run predates the firmwarekit build or the FirmwareKit job failed)' }

          # LightTouchDevice.exe (device helper): staged from the windows-ci
          # LightTouchDevice artifact by the *.exe glob above, once windows-ci
          # builds it. Warn-only, like firmwarekit above: the app launches
          # without it; it only gates device-helper functions. Staging the
          # exe alone does not make the helper usable end-to-end (app helper
          # path + guestTools work are separate and still pending).
          if (Test-Path (Join-Path $layout 'LightTouchDevice.exe')) { Write-Host 'Staged LightTouchDevice.exe (device helper)' } else { Write-Warning 'LightTouchDevice.exe not staged (windows-ci run predates the helper build or the LightTouchDevice job failed)' }

          # qemu-system-arm.exe + MinGW runtime DLLs (when the artifact exists)
          if (Test-Path qemu-artifact) {
            Get-ChildItem qemu-artifact -Recurse -Include *.exe,*.dll | Copy-Item -Destination $layout -Force
          } else {
            Write-Warning 'qemu-system-arm.exe not staged (no emulator artifact)'
          }

          # Qt UI executable (when the artifact exists)
          if (Test-Path qt-artifact/LightTouch.exe) {
            Copy-Item qt-artifact/LightTouch.exe $layout -Force
          }

          # Swift runtime DLLs: swift.org's installer SPLITS compiler and
          # runtime. swiftc lives in Toolchains\<ver>+Asserts\usr\bin (which
          # holds dispatch/BlocksRuntime but NO stdlib DLLs); the stdlib
          # DLLs live in Runtimes\<ver>\usr\bin, which is on PATH (that is
          # how windows-ci test binaries load swiftCore at run time).
          # Probe proof (run 40116520974): where.exe swiftCore.dll ->
          # ...\Programs\Swift\Runtimes\6.2.4\usr\bin\swiftCore.dll; System32
          # has no Swift DLLs; the toolchain root has no swiftCore at all.
          $binDir = Split-Path (Get-Command swiftc.exe).Source
          $libDir = Join-Path (Split-Path $binDir) 'lib\swift\windows'
          $toolchainRoot = Split-Path (Split-Path $binDir)
          $swiftHome = Split-Path (Split-Path $toolchainRoot)
          $candidates = @($binDir, $libDir, (Join-Path $libDir 'x86_64'))
          $runtimesDir = Join-Path $swiftHome 'Runtimes'
          if (Test-Path $runtimesDir) {
            Get-ChildItem $runtimesDir -Directory -ErrorAction SilentlyContinue | ForEach-Object { $candidates += (Join-Path $_.FullName 'usr\bin') }
          }
          # LTAppCore.dll load-time imports (objdump, no delay-load table): these 10 Swift runtime DLLs must ship
          # or the bridge dlopen fails -> real-core exit 1. dispatch.dll (C library) does NOT substitute for
          # swiftDispatch.dll (Swift overlay) - the Windows loader matches exact file names.
          foreach ($dll in 'swiftCore.dll', 'swift_Concurrency.dll', 'Foundation.dll', 'dispatch.dll', 'BlocksRuntime.dll', 'FoundationEssentials.dll', 'FoundationInternationalization.dll', 'FoundationNetworking.dll', 'swiftCRT.dll', 'swiftDispatch.dll', 'swiftObservation.dll', 'swiftWinSDK.dll', 'swift_StringProcessing.dll', '_FoundationICU.dll', 'swift_RegexParser.dll') {
            $found = $false
            $w = where.exe $dll 2>$null
            if ($LASTEXITCODE -eq 0 -and $w) {
              $p = ($w | Select-Object -First 1).Trim()
              Copy-Item $p $layout -Force; Write-Host "Swift runtime $dll <- PATH: $p"; $found = $true
            } else {
              foreach ($d in $candidates) {
                $p = Join-Path $d $dll
                if (Test-Path $p) { Copy-Item $p $layout -Force; Write-Host "Swift runtime $dll <- $d"; $found = $true; break }
              }
            }
            if (-not $found) { Write-Warning "Swift runtime DLL not found: $dll (searched PATH + $($candidates -join ', '))" }
          }
          if (-not (Test-Path (Join-Path $layout 'swiftCore.dll'))) { Write-Error 'swiftCore.dll missing after search — refusing to ship a ZIP that cannot run'; exit 1 }
          foreach ($dll in 'FoundationEssentials.dll', 'FoundationInternationalization.dll', 'FoundationNetworking.dll', 'swiftCRT.dll', 'swiftDispatch.dll', 'swiftObservation.dll', 'swiftWinSDK.dll', 'swift_StringProcessing.dll', '_FoundationICU.dll', 'swift_RegexParser.dll') {
            if (-not (Test-Path (Join-Path $layout $dll))) { Write-Error "LTAppCore runtime DLL missing after search: $dll — refusing to ship a ZIP whose real core cannot load"; exit 1 }
          }

          # resources/ (firmware catalog; appDir + "/resources")
          # Bridge.cpp sets resourceDir = appDir + "/resources", appDir =
          # the exe dir, so resources go to LightTouch/resources.
          # CAVEAT (not a run-1 fix): run-1 is still under W1 diagnosis;
          # this only fills the known missing-resources/ gap (packages
          # shipped no resources/, catalog always empty).
          if (-not (Test-Path LightTouchMac/Resources/firmware-catalog.json)) { Write-Error 'resources source missing: LightTouchMac/Resources/firmware-catalog.json'; exit 1 }
          New-Item -ItemType Directory -Force -Path LightTouch/resources | Out-Null
          Copy-Item LightTouchMac/Resources/* LightTouch/resources -Force

          # Pre-unpacked guest-tools/ (device creation; the firmwarekit CLI resolves
          # guestTools to <exe-dir>/resources/guest-tools/ on Windows).
          # guest.aar is NOT staged: GuestArchive extraction needs AppleArchive
          # (macOS-only) and throws on Windows, so only a pre-unpacked directory
          # works. Source is the repo's vendor resources dir (populated when guest
          # tools are provisioned from macOS); warn-only until then — failing here
          # would break every package build while tools are absent, and an absent
          # dir fails honestly later (Recipe lock step) instead.
          if (Test-Path LightTouchMac/Resources/Guest/guest-tools) {
            Copy-Item LightTouchMac/Resources/Guest/guest-tools LightTouch/resources/guest-tools -Recurse -Force
            Write-Host 'Staged pre-unpacked guest-tools (device creation)'
          } else {
            Write-Warning 'pre-unpacked guest-tools not staged (LightTouchMac/Resources/Guest/guest-tools absent); device creation will fail at the lock step until tools are provisioned'
          }

          Write-Host '--- layout contents ---'
          Get-ChildItem $layout | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      # Gap 3 (first commit): stage the Qt runtime next to the exe so it
      # runs standalone. windeployqt copies the Qt6 DLLs the exe links
      # (flat, next to the exe — the loader requires that) and the plugins
      # (platforms/qwindows.dll, imageformats, QML imports) into their
      # standard subdirs, which Qt finds relative to the exe dir. No
      # qt.conf needed for that layout. Skipped (warn, job stays green)
      # when no exe was staged; a windeployqt failure with an exe present
      # fails the job loudly — shipping a ZIP whose exe cannot start
      # must not pass silently. Core DLLs need no new work here: the
      # Swift package DLLs are already staged above, and the exe's QML
      # is embedded (qrc:/qml/main.qml), so no qml/ files are staged.
      - name: Deploy Qt runtime (windeployqt, Gap 3)
        run: |
          if (-not (Test-Path LightTouch/LightTouch.exe)) { Write-Warning 'No LightTouch.exe staged; skipping Qt deploy'; exit 0 }
          $windeployqt = (Get-Command windeployqt -ErrorAction SilentlyContinue).Source
          if (-not $windeployqt -and $env:QT_ROOT_DIR) {
            $cand = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
            if (Test-Path $cand) { $windeployqt = $cand }
          }
          if (-not $windeployqt) { Write-Error 'windeployqt not found (Qt install step must provide it)'; exit 1 }
          & $windeployqt --release --compiler-runtime --qmldir QtUI/qml LightTouch/LightTouch.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "windeployqt failed with exit code $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path LightTouch/Qt6Core.dll)) { Write-Error 'Qt6Core.dll missing after windeployqt'; exit 1 }
          if (-not (Test-Path LightTouch/platforms/qwindows.dll)) { Write-Error 'platforms/qwindows.dll missing after windeployqt'; exit 1 }
          $qtDlls = @(Get-ChildItem LightTouch -Filter Qt6*.dll).Count
          Write-Host "Qt runtime staged: $qtDlls Qt6 DLLs + plugins (platforms/qwindows.dll present)"
          # windeployqt ships only qwindows.dll into platforms/; the
          # headless launch (smoke test) needs qoffscreen.dll too, and
          # qminimal.dll is the fallback platform. Copy both from the
          # Qt install when present (warn, don't fail, if absent — the
          # smoke workflow's preflight is where their absence fails).
          $qtDir = (Get-Item $windeployqt).Directory.Parent.FullName
          $platSrc = Join-Path $qtDir 'plugins\platforms'
          foreach ($plug in @('qoffscreen.dll', 'qminimal.dll')) {
            $src = Join-Path $platSrc $plug
            if (Test-Path $src) { Copy-Item $src LightTouch/platforms/ -Force; Write-Host "Staged extra platform plugin: $plug" }
            else { Write-Warning "Platform plugin not in Qt install: $src" }
          }

      - name: Create portable ZIP
        run: |
          $lines = @(
            'LightTouch — portable Windows build (cross-platform port)'
            ''
            "Windows CI run: ${{ steps.run-id.outputs.run_id }} (head ${{ steps.run-id.outputs.head_sha }})"
            ''
            'Swift package DLLs by artifact:'
          )
          foreach ($pkg in @('HostRuntime','DeviceServices','ReleaseChecks','BuildTools','FirmwareKit','DeviceRuntime','LightTouchCore','LTAppCore','LightTouchDevice')) {
            $dir = "swift-artifacts/swift-$pkg-windows-x86_64"
            if (Test-Path $dir) {
              $n = @(Get-ChildItem $dir -Recurse -Filter *.dll).Count
              $lines += "  swift-$pkg-windows-x86_64 : $n DLLs"
            } else {
              $lines += "  swift-$pkg-windows-x86_64 : MISSING (that job's build failed)"
            }
          }
          $lines += ''
          $lines += "qemu-system-arm.exe: $(if (Test-Path LightTouch/qemu-system-arm.exe) { 'present' } else { 'MISSING — no successful emulator run / artifact expired' })"
          $lines += "LightTouch.exe (Qt UI): $(if (Test-Path LightTouch/LightTouch.exe) { 'present' } else { 'MISSING — no windows-qt-ci run with the Qt artifact for this branch (Gap 2)' })"
          $lines += "Qt runtime (Gap 3): $(@(Get-ChildItem LightTouch -Filter Qt6*.dll).Count) Qt6 DLLs; platforms/qwindows.dll: $(if (Test-Path LightTouch/platforms/qwindows.dll) { 'present' } else { 'MISSING' })"
          $lines += 'Swift runtime DLLs:'
          foreach ($dll in 'swiftCore.dll', 'swift_Concurrency.dll', 'Foundation.dll', 'dispatch.dll', 'BlocksRuntime.dll', 'FoundationEssentials.dll', 'FoundationInternationalization.dll', 'FoundationNetworking.dll', 'swiftCRT.dll', 'swiftDispatch.dll', 'swiftObservation.dll', 'swiftWinSDK.dll', 'swift_StringProcessing.dll', '_FoundationICU.dll', 'swift_RegexParser.dll') {
            $lines += "  $dll : $(if (Test-Path LightTouch/$dll) { 'present' } else { 'MISSING' })"
          }
          $lines += "Total DLLs in layout: $(@(Get-ChildItem LightTouch -Filter *.dll).Count)"
          $lines += ''
          $lines += 'Staged files:'
          $lines += (Get-ChildItem LightTouch | ForEach-Object { "  $($_.Name) ($($_.Length) bytes)" })
          $lines | Out-File LightTouch/README.txt -Encoding utf8
          Compress-Archive -Path LightTouch -DestinationPath LightTouch-windows-x86_64.zip -Force
          Write-Host "ZIP size: $((Get-Item LightTouch-windows-x86_64.zip).Length) bytes"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lighttouch-windows-x86_64-portable
          path: LightTouch-windows-x86_64.zip
          retention-days: 30
