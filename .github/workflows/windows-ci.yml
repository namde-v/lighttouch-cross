# LightTouch cross-platform port — Windows CI
#
# On every push/PR: builds and unit-tests each portable Swift package under
# Packages/ on a real Windows runner (windows-latest).
#
# Toolchain: installed via compnerd/gha-setup-swift (the Swift-on-Windows
# maintainer's action), pinned to swift-6.2.4-release. Both the WinGet-published
# Swift.Toolchain and swift-actions/setup-swift failed on fresh runners with
# "unable to load standard library for target 'x86_64-unknown-windows-msvc'",
# so the install method — not the version — was the problem.
#
# The runners ARE the test machines (no local Windows box): every matrix job
# runs the full `swift test` suite, captures build + test logs, and uploads
# logs AND binaries on EVERY run — pass or fail — so failures are diagnosable
# from the artifacts alone.
#
# Artifacts per package (30-day retention, stable names for the packaging
# workflow): `swift-<Package>-windows-x86_64` (release DLLs, import libs,
# executables; absent when the build fails) and
# `swift-<Package>-windows-x86_64-logs` (build.log + test.log, always).
#
# Caching: SwiftPM dependency checkouts + the shared SwiftPM package cache are
# cached per package (keyed on the manifests). Compiled objects are
# deliberately NOT cached: the .build trees are GBs per package and the
# cache upload/restore would cost more minutes than recompiling saves.
name: Windows CI

on:
  push:
    branches: [main, port/**, win/**]
  pull_request:

env:
  # Version used for local Linux development (Linux CI installs exactly this).
  # Windows CI uses swift-6.2.4-release via the compnerd action (see below);
  # manifests declare tools-version 6.0/6.2, so the skew is safe.
  SWIFT_VERSION: "6.4.1"

jobs:
  build-and-test:
    name: swift build + test (${{ matrix.package }})
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        package:
          - HostRuntime
          - DeviceServices
          - ReleaseChecks
          - BuildTools
          - FirmwareKit
          - DeviceRuntime
          - LightTouchCore
          - LTAppCore
          - LightTouchDevice
    defaults:
      run:
        working-directory: Packages/${{ matrix.package }}
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE

      - name: Show toolchain
        run: swift --version

      # Skip re-cloning swift-crypto, MachOKit, ZIPFoundation, etc. on every
      # run. Keyed on the package manifests; restore-keys fall back to the
      # newest cache for this package when the manifests change (SwiftPM then
      # re-resolves incrementally on top of it).
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            Packages/${{ matrix.package }}/.build/checkouts
            ~\AppData\Local\org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-6.2.4-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package), format('Packages/{0}/Package.resolved', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-6.2.4-${{ matrix.package }}-

      # Windows runners are headless: anything needing a display must be
      # guarded in code/tests. UI tests for the Qt 6 rewrite run offscreen
      # (QT_QPA_PLATFORM=offscreen) in windows-qt-ci.yml.
      #
      # Both steps tee their output to log files so the logs can be uploaded
      # as artifacts below. $LASTEXITCODE survives the Tee-Object pipeline and
      # carries swift's exit code, so failures still fail the step.
      - name: Build
        run: |
          swift build --configuration release --build-tests -Xswiftc -enable-testing 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The test binary links XCTest.dll and Testing.dll, which live in the
      # Swift install tree, NOT on the loader's search path. Stage the
      # x86_64 copies next to the binary and prepend their dirs to PATH.
      #
      # Architecture matters: the install tree ships both bin32 and bin64
      # copies. A blind "first match" previously staged the 32-bit DLLs, and a
      # 32-bit DLL in a 64-bit process's directory fails the load with
      # 0xC000007B. Select by PE machine type (0x8664 = x86_64) instead.
      - name: Stage test runner DLLs
        run: |
          $releaseDir = ".build\x86_64-unknown-windows-msvc\release"
          $roots = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Swift\Platforms"),
            (Join-Path $env:LOCALAPPDATA "Programs\Swift\Toolchains")
          ) | Where-Object { Test-Path $_ }
          function Get-PeMachine([string]$path) {
            $s = [System.IO.File]::OpenRead($path)
            try {
              $r = New-Object System.IO.BinaryReader($s)
              $s.Position = 0x3C
              $e_lfanew = $r.ReadInt32()
              $s.Position = $e_lfanew + 4
              return $r.ReadUInt16()
            } finally { $s.Close() }
          }
          $dllDirs = @()
          foreach ($name in @("XCTest.dll", "Testing.dll")) {
            $cands = foreach ($root in $roots) {
              Get-ChildItem -Path $root -Recurse -Filter $name -ErrorAction SilentlyContinue
            }
            foreach ($c in $cands) {
              Write-Host ("candidate: {0} machine=0x{1:X4}" -f $c.FullName, (Get-PeMachine $c.FullName))
            }
            $pick = $cands | Where-Object { (Get-PeMachine $_.FullName) -eq 0x8664 } | Select-Object -First 1
            if (-not $pick) { Write-Host "::error::no x86_64 $name found under $($roots -join ', ')"; exit 1 }
            Copy-Item $pick.FullName $releaseDir -Force
            Write-Host "staged $name (x64) from $($pick.FullName)"
            $dllDirs += Split-Path $pick.FullName -Parent
          }
          $dllDirs = $dllDirs | Select-Object -Unique
          Add-Content -Path $env:GITHUB_PATH -Value ($dllDirs -join ";")
          Write-Host ("PATH += " + ($dllDirs -join ";"))

      # DIAGNOSTIC (LightTouchCore only): build the test binary and run it
      # directly to separate "the binary won't start" from "swift test won't
      # launch it". Informational: never fails the job; the Test step below
      # is the verdict.
      - name: "DIAG: direct test-binary run"
        if: matrix.package == 'LightTouchCore'
        run: |
          $releaseDir = ".build\x86_64-unknown-windows-msvc\release"
          $bin = Join-Path $releaseDir "LightTouchCorePackageTests.xctest"
          Write-Host "DIAG: building test binary (swift test would do this)..."
          swift build --build-tests --configuration release -Xswiftc -enable-testing 2>&1 | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { Write-Host "DIAG: build-tests failed"; exit 0 }
          $item = Get-Item $bin -ErrorAction SilentlyContinue
          if (-not $item) { Write-Host "DIAG: $bin not found"; exit 0 }
          Write-Host ("DIAG: binary {0} bytes" -f $item.Length)
          # Headless CI: a crash must surface as an exit code, never a WER dialog.
          # Also collect a crash dump so a startup crash can be post-mortemed.
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name "DontShowUI" -Value 1 -ErrorAction SilentlyContinue
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpFolder" -Value (Get-Location).Path -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpType" -Value 1 -ErrorAction SilentlyContinue
          function Run-Binary([string]$label, [string[]]$arguments, [int]$timeoutSec) {
            Write-Host "DIAG: [$label] launching, ${timeoutSec}s timeout"
            $p = Start-Process -FilePath $bin -ArgumentList $arguments -RedirectStandardOutput "diag-$label-stdout.log" -RedirectStandardError "diag-$label-stderr.log" -NoNewWindow -PassThru
            $exited = $p.WaitForExit($timeoutSec * 1000)
            if ($exited) {
              Write-Host ("DIAG RESULT [$label]: exited, code={0}" -f $p.ExitCode)
            } else {
              Write-Host "DIAG RESULT [$label]: NO EXIT (hang)"
              $p.Kill()
            }
            $so = Get-Item "diag-$label-stdout.log" -ErrorAction SilentlyContinue
            $se = Get-Item "diag-$label-stderr.log" -ErrorAction SilentlyContinue
            Write-Host ("DIAG [$label]: stdout bytes={0}" -f ($so ? $so.Length : -1))
            if ($so -and $so.Length -gt 0) { Get-Content "diag-$label-stdout.log" -TotalCount 25 | Write-Host }
            Write-Host ("DIAG [$label]: stderr bytes={0}" -f ($se ? $se.Length : -1))
            if ($se -and $se.Length -gt 0) { Get-Content "diag-$label-stderr.log" -Tail 25 | Write-Host }
            $started = $false
            if ($so -and $so.Length -gt 0) { $started = Select-String -Path "diag-$label-stdout.log" -Pattern "Test run started|Test Suite 'All tests' started" -Quiet }
            Write-Host "DIAG [$label]: runner-started-seen=$started"
          }
          Run-Binary "help" @("--help") 30
          Get-ChildItem -Filter *.dmp -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("DIAG: crash dump {0} ({1} bytes)" -f $_.Name, $_.Length) }

      # procdump is NOT on the win25-vs2026 runner image (verified 2026-10-22:
      # "The term 'procdump' is not recognized"). The Test step's freeze
      # watchdog needs it to capture ltc-freeze.dmp. Install it before Test:
      # Chocolatey first, direct Sysinternals download as fallback.
      # Non-interactive; never fails the job (watchdog kills without a dump
      # if procdump is unavailable).
      - name: Install procdump
        if: matrix.package == 'LightTouchCore'
        run: |
          if (Get-Command procdump -ErrorAction SilentlyContinue) {
            Write-Host "procdump already on PATH"
            exit 0
          }
          $ok = $false
          try {
            choco install procdump -y --no-progress 2>&1 | Select-Object -Last 3 | Write-Host
            if (Get-Command procdump -ErrorAction SilentlyContinue) { $ok = $true }
          } catch { Write-Host "choco install failed (non-fatal): $_" }
          if (-not $ok) {
            Write-Host "Falling back to direct Sysinternals download..."
            try {
              $zip = Join-Path $env:RUNNER_TEMP "procdump.zip"
              $dir = Join-Path $env:RUNNER_TEMP "procdump"
              Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              # Persist for subsequent steps in this job:
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:PATH = "$dir;$env:PATH"
              if (Get-Command procdump -ErrorAction SilentlyContinue) { $ok = $true }
            } catch { Write-Host "Sysinternals download failed (non-fatal): $_" }
          }
          if ($ok) {
            & procdump -accepteula -? 2>&1 | Select-Object -First 2 | Write-Host
            Write-Host "procdump ready"
          } else {
            Write-Host "WARNING: procdump unavailable — freeze watchdog will kill without a minidump"
          }

      - name: Test
        if: matrix.package != 'LightTouchDevice'
        timeout-minutes: 240
        run: |
          # Headless CI: a crashing test binary must surface as an exit code,
          # never a WER dialog that looks like a hang (cf. the 0xC000007B saga).
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name "DontShowUI" -Value 1 -ErrorAction SilentlyContinue
          if ("${{ matrix.package }}" -eq "LightTouchCore") {
            # Run the test binary directly: swift-testing reports to stderr and
            # swift test's forwarding drops it on this toolchain. Capture the
            # full output for triage; the binary's exit code is the verdict.
            # 220-min budget inside the 4h job timeout (user order 2026-10-19).
            $bin = ".build\x86_64-unknown-windows-msvc\release\LightTouchCorePackageTests.xctest"
            $p = Start-Process -FilePath $bin -ArgumentList "--testing-library", "swift-testing" -RedirectStandardOutput "full-stdout.log" -RedirectStandardError "full-stderr.log" -NoNewWindow -PassThru
            # Crash monitor (2026-10-23): the suite now runs past the old
            # freeze but the binary dies with 0xC000001D (illegal instruction)
            # mid-suite. Attach procdump as debugger so a hard crash leaves
            # crash.dmp with the exact trapping stack instead of just an exit
            # code. Non-fatal if it fails to attach; exits on its own when
            # the test binary exits.
            $crashMonitor = $null
            try {
              $crashMonitor = Start-Process -FilePath "procdump" -ArgumentList "-accepteula","-ma","-e",$p.Id,"crash.dmp" -NoNewWindow -PassThru -ErrorAction Stop
            } catch {
              Write-Host "crash-monitor attach failed (non-fatal): $_"
            }
            # Progress watchdog (2026-10-21): the suite froze ~6s after launch on
            # 2026-10-21 (35/1517 completions, then 3h40m silence) and 2026-10-19.
            # If full-stderr.log stops growing for 10 min, the suite has frozen —
            # capture a minidump for forensics, then kill. Don't burn 220 min.
            $lastSize = -1
            $stalledSince = [DateTime]::UtcNow
            $deadline = [DateTime]::UtcNow.AddMinutes(220)
            $reason = ""
            while (-not $p.HasExited) {
              Start-Sleep -Seconds 30
              if ([DateTime]::UtcNow -ge $deadline) {
                $reason = "TIMEOUT after 220 min (suite too slow for the 4h job)"
                break
              }
              $logFile = Get-Item "full-stderr.log" -ErrorAction SilentlyContinue
              $size = if ($null -eq $logFile) { 0 } else { $logFile.Length }
              if ($size -gt $lastSize) {
                $lastSize = $size
                $stalledSince = [DateTime]::UtcNow
              } elseif ([DateTime]::UtcNow - $stalledSince -gt [TimeSpan]::FromMinutes(10)) {
                $reason = "STALLED — no test output for 10 min (last size $lastSize bytes)"
                break
              }
            }
            if (-not $p.HasExited) {
              Write-Host "TEST RESULT: $reason"
              # Capture a minidump BEFORE killing: reveals the exact blocking
              # stack of the frozen suite (cf. ltc-suite-analysis/ANALYSIS.md).
              # procdump is installed by the "Install procdump" step above;
              # if it is still missing, failure is non-fatal (watchdog still
              # kills the hang).
              try {
                & procdump -accepteula -ma $p.Id "ltc-freeze.dmp" 2>&1 | Write-Host
                Write-Host "Minidump captured: ltc-freeze.dmp"
              } catch {
                Write-Host "procdump failed (non-fatal): $_"
              }
              $p.Kill()
              exit 1
            }
            Write-Host ("TEST RESULT: exited, code={0}" -f $p.ExitCode)
            if ($null -ne $crashMonitor -and -not $crashMonitor.HasExited) { $crashMonitor.Kill() }
            if (Test-Path "crash.dmp") { Write-Host "Crash dump captured: crash.dmp" }
            Get-Content "full-stderr.log" | Tee-Object -FilePath test.log | Select-Object -Last 5 | Write-Host
            if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          } else {
            # Progress watchdog (2026-10-25): HostRuntime hung TWICE at
            # SwiftPM planning (test.log held only "[0/1] Planning build",
            # zero test output) on win/w-dr-discovery 6faf951 — attempt 1
            # burned the 240-min job ceiling, attempt 2 was cancelled at
            # ~61 min with a byte-identical log. The plain
            # `swift test | Tee-Object` pipeline blocks forever with no
            # watchdog, so a planning hang looks like silence. Run swift
            # test as a child process and watch the logs grow: 10 min with
            # no new output = hang, kill and fail fast so the log shows
            # WHERE it stuck. Same 10-min rule as the LightTouchCore
            # branch above; applies to every non-LTC package here.
            $p = Start-Process -FilePath "swift" -ArgumentList "test","--configuration","release","--skip-build" -RedirectStandardOutput "full-stdout.log" -RedirectStandardError "full-stderr.log" -NoNewWindow -PassThru
            $lastSize = -1
            $stalledSince = [DateTime]::UtcNow
            $deadline = [DateTime]::UtcNow.AddMinutes(220)
            $reason = ""
            while (-not $p.HasExited) {
              Start-Sleep -Seconds 30
              if ([DateTime]::UtcNow -ge $deadline) {
                $reason = "TIMEOUT after 220 min"
                break
              }
              $size = 0
              foreach ($f in @("full-stdout.log", "full-stderr.log")) {
                $item = Get-Item $f -ErrorAction SilentlyContinue
                if ($null -ne $item) { $size += $item.Length }
              }
              if ($size -gt $lastSize) {
                $lastSize = $size
                $stalledSince = [DateTime]::UtcNow
              } elseif ([DateTime]::UtcNow - $stalledSince -gt [TimeSpan]::FromMinutes(10)) {
                $reason = "STALLED — no test output for 10 min (last size $lastSize bytes)"
                break
              }
            }
            # Merge both streams into test.log (the triage + artifact file);
            # ordering across streams is approximate, content is complete.
            Get-Content "full-stdout.log" -ErrorAction SilentlyContinue | Out-File -FilePath test.log -Encoding utf8
            Get-Content "full-stderr.log" -ErrorAction SilentlyContinue | Out-File -FilePath test.log -Encoding utf8 -Append
            if (-not $p.HasExited) {
              Write-Host "TEST RESULT: $reason"
              $p.Kill()
              exit 1
            }
            Write-Host ("TEST RESULT: exited, code={0}" -f $p.ExitCode)
            if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          }

      # Phase 2 proof (LightTouchDevice leg only): load-path test against a
      # SAME-BRANCH emulator artifact. NOT the matrix Test step (the batch-5
      # skip above stays): this step resolves the latest successful
      # windows-emulator-ci run on this branch, downloads
      # qemu-system-arm-windows-x86_64, and runs the load test in DEBUG
      # (the LTM_QEMU_DLL override is DEBUG-only; the matrix Test step runs
      # release). FAILS LOUDLY if no same-branch emulator run exists or the
      # artifact lacks qemu-arm.dll — no best-effort weakening. Post-merge,
      # main emulator runs carry the DLL once the Bundle copy merges, so the
      # same step keeps working.
      - name: QEMU DLL load-path proof
        if: matrix.package == 'LightTouchDevice'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-emulator-ci.yml/runs?branch=$env:GITHUB_REF_NAME&status=completed&per_page=10" --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | Select-Object -First 1
          if (-not $runId) { Write-Error "No successful windows-emulator-ci run on branch $env:GITHUB_REF_NAME yet — dispatch it first (its workflow carries the Phase 2 Bundle copy)"; exit 1 }
          Write-Host "Using emulator run $runId"
          gh run download $runId --name qemu-system-arm-windows-x86_64 --dir emu-artifact
          $dll = Get-ChildItem emu-artifact -Recurse -Filter qemu-arm.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "Emulator artifact from run $runId lacks qemu-arm.dll — the DLL step failed or the run predates the Phase 2 Bundle copy"; exit 1 }
          Write-Host "qemu-arm.dll: $($dll.FullName)"
          # The DLL's MinGW deps ride in the same artifact dir; prepend it so
          # LoadLibraryW resolves them exactly as LightTouch/ does on disk.
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          $env:LTM_QEMU_DLL = $dll.FullName
          swift test --filter QemuLoadTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Phase 3, machines mode: run the BUILT helper binary (release, from the
      # Build step above) with a machines launch, not the unit test. The DLL is
      # copied beside the exe so this exercises the production exe-dir
      # candidate (a release build has no DEBUG LTM_QEMU_DLL override); the
      # artifact dir stays on PATH for the DLL's MinGW deps, mirroring
      # LightTouch/. Stdout is the Listing JSON only (helperLog goes to
      # stderr); machines mode exits 0 without parking, so the parkMainThread
      # question does not apply here.
      - name: QEMU machines-mode proof
        if: matrix.package == 'LightTouchDevice'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-emulator-ci.yml/runs?branch=$env:GITHUB_REF_NAME&status=completed&per_page=10" --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | Select-Object -First 1
          if (-not $runId) { Write-Error "No successful windows-emulator-ci run on branch $env:GITHUB_REF_NAME yet — dispatch it first (its workflow carries the Phase 2 Bundle copy)"; exit 1 }
          Write-Host "Using emulator run $runId"
          gh run download $runId --name qemu-system-arm-windows-x86_64 --dir emu-artifact
          $dll = Get-ChildItem emu-artifact -Recurse -Filter qemu-arm.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "Emulator artifact from run $runId lacks qemu-arm.dll — the DLL step failed or the run predates the Phase 2 Bundle copy"; exit 1 }
          $exe = ".build/release/LightTouchDevice.exe"
          if (-not (Test-Path $exe)) { Write-Error "Release helper exe missing: $exe (the Build step must run first)"; exit 1 }
          Copy-Item $dll.FullName (Split-Path $exe)
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          $out = & $exe '{"mode":{"machines":{}}}' 2> machines-stderr.log
          if ($LASTEXITCODE -ne 0) { Write-Error "machines mode exited $LASTEXITCODE"; Get-Content machines-stderr.log; exit $LASTEXITCODE }
          $listing = $out | ConvertFrom-Json
          if ($listing.machines.Count -eq 0) { Write-Error "machines listing empty"; exit 1 }
          if (-not $listing.dylibPath.EndsWith("qemu-arm.dll")) { Write-Error "dylibPath is not the DLL: $($listing.dylibPath)"; exit 1 }
          if ([string]::IsNullOrEmpty($listing.machines[0].board)) { Write-Error "first machine board empty"; exit 1 }
          Write-Host "machines OK: $($listing.machines.Count) machines via $($listing.dylibPath)"

      # Phase 3, oneshot mode: run the BUILT helper binary (release) with a
      # oneshot launch, minimal machine-only argv. This step doubles as the
      # parkMainThread/dispatchMain probe: the terminal oneshot event is
      # emitted via DispatchQueue.main.async, so it only appears if the main
      # queue drains while parked. PRE-REGISTERED signature: no terminal
      # event past timeout+margin (the watchdog below kills the helper) is
      # a park failure, NOT a QEMU failure. The helper runs under a
      # watchdog (180 s) so a park failure fails fast instead of hanging
      # the job. Tier 1 (must): terminal event + a QEMU-reaching exit
      # (not 64 usage, 70 no dylib, 75 lease). Tier 2 (stretch): elapsed
      # near the 60 s timeout (VM actually ran, not an instant init error);
      # a fast exit still passes Tier 1 but must be reported with QEMU's
      # stderr as the next diagnostic. -display none is the fork's own mode
      # (qemu-ios-ui.c header); the -M name comes from machines output
      # (DeviceInfo.machine), never hardcoded; environment is {} exactly
      # like Preparer.oneshot writes, so the setenv skip is moot here.
      - name: QEMU oneshot-mode proof
        if: matrix.package == 'LightTouchDevice'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-emulator-ci.yml/runs?branch=$env:GITHUB_REF_NAME&status=completed&per_page=10" --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | Select-Object -First 1
          if (-not $runId) { Write-Error "No successful windows-emulator-ci run on branch $env:GITHUB_REF_NAME yet — dispatch it first (its workflow carries the Phase 2 Bundle copy)"; exit 1 }
          Write-Host "Using emulator run $runId"
          # Fresh dir: steps 11/12 already extracted into emu-artifact, and re-extracting
          # there fails on the existing libbz2-1.dll (attempt-3 log) instead of overwriting.
          gh run download $runId --name qemu-system-arm-windows-x86_64 --dir oneshot-emu-artifact
          if ($LASTEXITCODE -ne 0) { Write-Error "emulator artifact download failed for run $runId"; exit 1 }
          $dll = Get-ChildItem oneshot-emu-artifact -Recurse -Filter qemu-arm.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "Emulator artifact from run $runId lacks qemu-arm.dll — the DLL step failed or the run predates the Phase 2 Bundle copy"; exit 1 }
          $exe = ".build/release/LightTouchDevice.exe"
          if (-not (Test-Path $exe)) { Write-Error "Release helper exe missing: $exe (the Build step must run first)"; exit 1 }
          Copy-Item $dll.FullName (Split-Path $exe)
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          $machinesOut = & $exe '{"mode":{"machines":{}}}' 2> oneshot-machines-stderr.log
          if ($LASTEXITCODE -ne 0) { Write-Error "machines pre-step exited $LASTEXITCODE"; Get-Content oneshot-machines-stderr.log; exit $LASTEXITCODE }
          $machine = ($machinesOut | ConvertFrom-Json).machines[0].machine
          if ([string]::IsNullOrEmpty($machine)) { Write-Error "no machine from machines pre-step"; exit 1 }
          Write-Host "oneshot machine: $machine"
          $cfg = @{ boot = @{ argv = @("LightTouchDevice", "-M", "$machine,amc-mode=registers", "-display", "none", "-serial", "file:oneshot-serial.log"); machine = $machine }; serialLog = "oneshot-serial.log"; timeout = 60 } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("oneshot.json", $cfg, (New-Object System.Text.UTF8Encoding($false)))
          $launch = '{"mode":{"oneshot":{"config":"oneshot.json"}}}'
          # Start-Process passes -ArgumentList verbatim to CreateProcess, so the CRT
          # strips the launch JSON's inner quotes (invalid JSON -> helper exit 64);
          # backslash-escape them so argv restores the exact JSON. The call-operator
          # machines pre-step above quotes implicitly, which is why it works.
          $launchArg = $launch.Replace([string]'"', [string]'\"')
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList $launchArg -RedirectStandardOutput oneshot-stdout.log -RedirectStandardError oneshot-stderr.log -NoNewWindow -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "WATCHDOG: helper did not terminate in 180 s — no terminal oneshot event is the pre-registered parkMainThread/dispatchMain hang signature, not a QEMU failure"; Get-Content oneshot-stdout.log; Get-Content oneshot-stderr.log; exit 1 }
          $elapsed = ((Get-Date) - $t0).TotalSeconds
          $event = Get-Content oneshot-stdout.log | Where-Object { $_ -match '"oneshot"' } | Select-Object -Last 1 | ConvertFrom-Json
          if (-not $event) {
            # v2: diagnostics FIRST — Write-Error is terminating under the runner's
            # Stop preference, so anything after it never runs (v1's artifacts never
            # printed on run 40946093089). Write-Host/Get-Content never terminate.
            Write-Host "helper exited $($p.ExitCode) after $elapsed s with no terminal oneshot event"
            Write-Host "oneshot-stdout.log:"; Get-Content oneshot-stdout.log
            Write-Host "oneshot-stderr.log:"; Get-Content oneshot-stderr.log
            Write-Host "oneshot.json:"; Get-Content oneshot.json
            if (Test-Path oneshot-serial.log) { $sl = Get-Item oneshot-serial.log; Write-Host "serial log exists: $($sl.Length) bytes"; Get-Content oneshot-serial.log -TotalCount 20 } else { Write-Host "serial log ABSENT (QEMU died before chardev init)" }
            Write-Host "exe-dir DLLs:"; Get-ChildItem (Split-Path $exe) -Filter *.dll | ForEach-Object { "$($_.Name) $($_.Length)" }
            Write-Error "no terminal oneshot event after $elapsed s (exit $($p.ExitCode))"
            exit 1
          }
          Write-Host "oneshot event: exited=$($event.exited) marker=$($event.marker) exitCode=$($event.exitCode) seconds=$($event.seconds) elapsed=$elapsed"
          if ($p.ExitCode -in @(64, 70, 75)) { Write-Error "helper never reached QEMU (exit $($p.ExitCode): 64 usage / 70 no dylib / 75 lease)"; Get-Content oneshot-stdout.log; Get-Content oneshot-stderr.log; exit 1 }
          if (Test-Path oneshot-serial.log) { Write-Host "serial log created" } else { Write-Host "NOTE: serial log not created" }
          if ($elapsed -lt 50) { Write-Host "NOTE: fast exit ($elapsed s) — Tier 2 (VM ran to timeout) NOT met; Tier 1 holds, report QEMU stderr as next diagnostic"; Get-Content oneshot-stderr.log }

      # if: always() — binaries AND logs upload on every run, pass or fail.
      # if-no-files-found: warn (not error): a failed build legitimately has
      # no binaries, and a build-step failure means there is no test.log yet.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-${{ matrix.package }}-windows-x86_64
          path: |
            Packages/${{ matrix.package }}/.build/x86_64-unknown-windows-msvc/release/*.dll
            Packages/${{ matrix.package }}/.build/x86_64-unknown-windows-msvc/release/*.lib
            Packages/${{ matrix.package }}/.build/x86_64-unknown-windows-msvc/release/*.exe
            Packages/${{ matrix.package }}/.build/x86_64-unknown-windows-msvc/release/*.xctest
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-${{ matrix.package }}-windows-x86_64-logs
          path: |
            Packages/${{ matrix.package }}/build.log
            Packages/${{ matrix.package }}/test.log
            Packages/${{ matrix.package }}/full-stdout.log
            Packages/${{ matrix.package }}/full-stderr.log
            Packages/${{ matrix.package }}/ltc-freeze.dmp
            Packages/${{ matrix.package }}/crash.dmp
          if-no-files-found: warn
          retention-days: 30
