# LightTouch cross-platform port — Windows CI
#
# On every push/PR: builds and unit-tests each portable Swift package under
# Packages/ on a real Windows runner (windows-latest).
#
# Toolchain: installed via WinGet per https://www.swift.org/install/windows/
# (the swift-actions/setup-swift action's hardcoded version list lags behind
# swift.org releases, so it is intentionally not used). WinGet installs the
# latest published Swift toolchain; SWIFT_VERSION below documents the version
# local Linux development uses — keep them close and bump together.
name: Windows CI

on:
  push:
    branches: [main, port/**]
  pull_request:

env:
  # Version used for local Linux development; Windows gets the latest
  # WinGet-published toolchain (currently the 6.4.x line).
  SWIFT_VERSION: "6.4.1"

jobs:
  build-and-test:
    name: swift build + test (${{ matrix.package }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package:
          - HostRuntime
          - DeviceServices
          - ReleaseChecks
          - BuildTools
          - FirmwareKit
          - DeviceRuntime
          - LightTouchCore
    defaults:
      run:
        working-directory: Packages/${{ matrix.package }}
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Swift
        run: |
          winget install --id Swift.Toolchain -e --source winget `
            --accept-source-agreements --accept-package-agreements `
            --silent --disable-interactivity
          # Make sure the toolchain is on PATH for the following steps,
          # regardless of whether the installer updated the machine PATH.
          $swiftExe = Get-ChildItem -Path @(
              "$env:LOCALAPPDATA\Programs\Swift",
              "$env:SystemDrive\Library\Developer"
            ) -Recurse -Filter swift.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $swiftExe) { throw "swift.exe not found after install" }
          Add-Content -Path $env:GITHUB_PATH -Value $swiftExe.DirectoryName

      - name: Show toolchain
        run: swift --version

      # Windows runners are headless: anything needing a display must be
      # guarded in code/tests. UI tests for the Qt 6 rewrite run under
      # QT_QPA_PLATFORM=minimal in a separate workflow (later phase).
      - name: Build
        run: swift build --configuration release

      - name: Test
        run: swift test --skip-build
