          +++ b/tests/qtest/ipad1-h2fmi-test.c
          @@ -36,6 +36,27 @@ static int portable_kill(GPid pid, int sig)
           #define kill portable_kill
           #endif
 
          +#ifdef _WIN32
          +/* UCRT has no pread()/pwrite(); emulate positionally with lseek. The test is
          + * single-threaded on these descriptors, so the lseek+read/write pair is safe. */
          +static ssize_t portable_pread(int fd, void *buf, size_t n, off_t off)
          +{
          +    if (lseek(fd, off, SEEK_SET) < 0) {
          +        return -1;
          +    }
          +    return read(fd, buf, (unsigned)n);
          +}
          +static ssize_t portable_pwrite(int fd, const void *buf, size_t n, off_t off)
          +{
          +    if (lseek(fd, off, SEEK_SET) < 0) {
          +        return -1;
          +    }
          +    return write(fd, buf, (unsigned)n);
          +}
          +#define pread portable_pread
          +#define pwrite portable_pwrite
          +#endif
          +
           #define FMI 0x81200000ULL
           #define FMC (FMI + 0x40000)
           #define PAGE_BYTES 4096
          PATCH_EOF
          sed -i 's/\r$//' win32-portability.patch
          git apply --check win32-portability.patch
          git apply win32-portability.patch

      - name: Pre-seed meson subprojects from GitHub mirrors
        run: |
          cd qemu-src
          seed_subproject() {
            # The subproject clones live inside qemu-src/, so a source-cache
            # hit already has them; just re-pin to the recorded commit.
            if [ ! -d "subprojects/$1/.git" ]; then
              rm -rf "subprojects/$1"
              git clone --quiet "$2" "subprojects/$1"
            fi
            git -C "subprojects/$1" fetch --depth 1 origin "$3"
            git -C "subprojects/$1" checkout --quiet "$3"
          }
          seed_subproject keycodemapdb https://github.com/qemu/keycodemapdb.git f5772a62ec52591ff6870b7e8ef32482371f22c6
          seed_subproject dtc https://github.com/qemu/dtc.git b6910bec11614980a21e46fbccc35934b671bd81
          seed_subproject berkeley-softfloat-3 https://github.com/qemu/berkeley-softfloat-3.git b64af41c3276f97f0e181920400ee056b9c88037
          seed_subproject berkeley-testfloat-3 https://github.com/qemu/berkeley-testfloat-3.git e7af9751d9f9fd3b47911f51a5cfd08af256a9ab
          cp subprojects/packagefiles/berkeley-softfloat-3/meson.build \
             subprojects/packagefiles/berkeley-softfloat-3/meson_options.txt \
             subprojects/berkeley-softfloat-3/
          cp subprojects/packagefiles/berkeley-testfloat-3/meson.build \
             subprojects/packagefiles/berkeley-testfloat-3/meson_options.txt \
             subprojects/berkeley-testfloat-3/

      - name: Configure
        run: |
          cd qemu-src
          mkdir -p build && cd build
          ../configure --target-list=arm-softmmu \
            --disable-capstone \
            --disable-slirp \
            --disable-werror \
            --enable-sdl \
            --extra-ldflags='-lcrypto'

      - name: Build
        run: |
          cd qemu-src/build
          make -j"$(nproc)"

      - name: Smoke test
        run: |
          cd qemu-src/build
          ./qemu-system-arm.exe --version
          ./qemu-system-arm.exe -M ? | grep -iE 'ipod|iphone|ipad'
          # -device ? enumerates the registered device models: proves the
          # binary initializes past machine listing without firmware images.
          ./qemu-system-arm.exe -device ? > devices.txt
          grep -ciE 'ipod|iphone|ipad' devices.txt

      - name: Build Windows QEMU DLL + smoke (Phase 1 proof)
        env:
          DLL_PIN: b7b274467e61986c095528877777bdebb0992ea7
        run: |
          # Phase 1 proof for the Windows QEMU DLL (Option A): link qemu-arm.dll
          # from the qemu-system-arm objects and smoke it (LoadLibrary +
          # device_info_at + build_id + api_version, no VM boot). Proof-only:
          # the DLL is NOT bundled into the artifact and NOT staged anywhere;
          # staging is Phase 2/3 + packaging work, not this step.
          # Requires the emulator branch pushed first: this SHA must resolve
          # on origin (namde-v/lighttouch-emulator branch qemu-dll-phase1).
          git clone --quiet https://github.com/namde-v/lighttouch-emulator.git emu-dll
          cd emu-dll
          git fetch --depth 1 origin "$DLL_PIN" || {
            echo "DLL_PIN $DLL_PIN not found on origin -- push qemu-dll-phase1 first" >&2
            exit 1
          }
          git checkout --quiet "$DLL_PIN"
          cd ..
          # The extras patch must be applied before the DLL step compiles
          # qemu-macos-extras.c (the exe build never compiles it, so patching
          # here -- after the exe build -- is safe and sufficient; the next
          # run's pinned-commit reset reverts it before its own build).
          cd qemu-src
          git apply --check ../emu-dll/windows-dll/qemu-windows-extras.patch
          git apply ../emu-dll/windows-dll/qemu-windows-extras.patch
          cd ..
          bash emu-dll/windows-dll/make-dll-windows.sh qemu-src qemu-src/build emu-dll/windows-dll/qemu-arm.def
          cc emu-dll/windows-dll/qemu-dll-smoke.c -o qemu-src/build/qemu-dll-smoke.exe
          cd qemu-src/build
          ./qemu-dll-smoke.exe ./qemu-arm.dll

      - name: Bundle binary and MinGW DLLs
        run: |
          cd qemu-src
          mkdir -p dist
          cp build/qemu-system-arm.exe dist/
          # Locate objdump robustly and FAIL LOUDLY if it is missing: a
          # missing objdump used to fail silently, producing DLL-less,
          # unrunnable bundles (the for loop just iterated over nothing).
          OBJDUMP=$(command -v x86_64-w64-mingw32-objdump || command -v objdump || ls /mingw64/bin/*-objdump.exe 2>/dev/null | head -1)
          if [ -z "$OBJDUMP" ]; then
            echo "ERROR: no objdump found; /mingw64/bin contents:"
            ls /mingw64/bin/ | head -40
            exit 1
          fi
          echo "Using objdump: $OBJDUMP"
          for dll in $("$OBJDUMP" -p build/qemu-system-arm.exe | awk '/DLL Name:/{print $3}'); do
            if [ -f "/mingw64/bin/$dll" ]; then cp "/mingw64/bin/$dll" dist/; fi
          done
          ls -la dist/

      # The artifact must be runnable from dist/ alone: every DLL the exe
      # imports has to be either bundled in dist/ or a Windows system DLL.
      # Anything else (e.g. a MinGW DLL the copy loop missed) fails the run.
      - name: Verify bundled DLLs are complete
        run: |
          cd qemu-src
          OBJDUMP=$(command -v x86_64-w64-mingw32-objdump || command -v objdump || ls /mingw64/bin/*-objdump.exe 2>/dev/null | head -1)
          if [ -z "$OBJDUMP" ]; then echo "ERROR: no objdump found"; exit 1; fi
          sys='kernel32\.dll|user32\.dll|gdi32\.dll|advapi32\.dll|shell32\.dll|ole32\.dll|oleaut32\.dll|uuid\.dll|msvcrt\.dll|ucrtbase\.dll|vcruntime140\.dll|ws2_32\.dll|winmm\.dll|version\.dll|secur32\.dll|crypt32\.dll|bcrypt\.dll|iphlpapi\.dll|dnsapi\.dll|imm32\.dll|comdlg32\.dll|comctl32\.dll|shlwapi\.dll|setupapi\.dll|wtsapi32\.dll|powrprof\.dll|dwmapi\.dll|uxtheme\.dll|ntdll\.dll|msimg32\.dll|gdiplus\.dll|opengl32\.dll|hid\.dll|api-ms-win-[a-z0-9-]+\.dll'
          fail=0
          for dll in $("$OBJDUMP" -p dist/qemu-system-arm.exe | awk '/DLL Name:/{print $3}'); do
            lc=$(printf '%s' "$dll" | tr 'A-Z' 'a-z')
            if [ -f "dist/$dll" ]; then continue; fi
            if printf '%s' "$lc" | grep -Eq "^($sys)$"; then continue; fi
            echo "NOT BUNDLED and not a system DLL: $dll"
            fail=1
          done
          exit $fail

      - name: Upload emulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-windows-x86_64
          path: qemu-src/dist/
          retention-days: 30

      # Runs before the post-job cache save, so the qemu-src cache entry stays
      # a lean source tree (no GBs of build objects or the dist/ staging dir).
      # `always()` keeps it lean even when the build fails.
      - name: Prune build outputs (keep source cache lean)
        if: always()
        run: |
          rm -rf qemu-src/build qemu-src/dist
