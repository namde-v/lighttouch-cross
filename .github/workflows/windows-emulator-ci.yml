          +/*
          + * Windows has no sys/mman.h. This file's only mapping is a read-only,
          + * private, whole-file mapping (PROT_READ|MAP_PRIVATE, offset 0) consumed
          + * read-only, so emulate it with a malloc'd buffer filled via read().
          + * Binary mode is forced: mingw open() defaults to text mode, which would
          + * corrupt the image.
