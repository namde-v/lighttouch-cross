           {
               static const char needle[] = "Epoch Mismatch";
          diff --git a/hw/arm/ipod_touch_fmss.c b/hw/arm/ipod_touch_fmss.c
          index 9b1802b..e0af3d8 100644
          --- a/hw/arm/ipod_touch_fmss.c
