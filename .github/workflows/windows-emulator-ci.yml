          +#ifndef MAP_FAILED
          +#define MAP_FAILED ((void *)-1)
          +#endif
          +#define PROT_READ 0
          +#define MAP_PRIVATE 0
          +static void *portable_mmap_ro(int fd, size_t length)
          +{
          +    uint8_t *buf = (uint8_t *)malloc(length ? length : 1);
          +    size_t got = 0;
          +    if (!buf) {
          +        return MAP_FAILED;
          +    }
          +    _setmode(fd, _O_BINARY);
          +    while (got < length) {
          +        int r = read(fd, buf + got, (unsigned)(length - got));
          +        if (r <= 0) {
          +            free(buf);
          +            return MAP_FAILED;
          +        }
