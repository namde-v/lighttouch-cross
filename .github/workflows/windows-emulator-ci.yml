name: Windows emulator CI

# Builds qemu-ios (LightTouchMac's QEMU fork — the emulation engine) for
# Windows x86-64 using MSYS2/MINGW64, and uploads qemu-system-arm.exe plus
# its MinGW runtime DLLs as a workflow artifact.
#
# The qemu-ios source itself is NOT in this repo: it is cloned fresh from
# https://github.com/samhenrigold/qemu-ios at the pinned commit below
# (the exact commit LightTouchMac pins in build-support/sources.json).
# A minimal link fix (amc-nonavcodec-fix.patch, documented in
# emulator/BUILD_LOG.md) is applied because we build without FFmpeg dev
# libraries; meson subprojects are pre-seeded from github.com/qemu mirrors
# so the build never touches gitlab.com.

on:
  push:
    branches: [main]
    # Only this workflow's own file triggers it: unrelated pushes (Swift code,
    # UI, docs) must not cancel the ~20-minute emulator build in flight.
    paths:
      - '.github/workflows/windows-emulator-ci.yml'
  workflow_dispatch:

concurrency:
  group: windows-emulator-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: "ccache gcc"
  CXX: "ccache g++"
  CCACHE_DIR: "C:/Users/runneradmin/.cache/ccache"
  CCACHE_MAXSIZE: "2G"
  QEMU_PIN: cb3595e8add3d9a3a55807186c6b8ff0ba338abe

jobs:
  build:
    name: Build qemu-system-arm (Windows x86-64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # Explicit even though true is the default: caches the pacman package
          # dir between runs so `update` + `install` below skip re-downloading.
          cache: true
          install: >-
            base-devel
            git
            bison
            flex
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: C:/Users/runneradmin/.cache/ccache
          key: qemu-ios-win-ccache-${{ github.sha }}
          restore-keys: |
            qemu-ios-win-ccache-

      # The qemu-ios clone (~1 GB history) + 4 meson subproject clones cost
      # several minutes per run. Cache the source tree keyed on the pinned
      # commit; the combined actions/cache step saves it at job end ONLY on a
      # cache miss. A "Prune build outputs" step at the end of the job keeps
      # build/ and dist/ out of the cache so it stays a source-only cache.
      - name: Restore qemu-ios source cache
        id: qemu-src-cache
        uses: actions/cache@v4
        with:
          path: qemu-src
          key: qemu-ios-win-src-${{ env.QEMU_PIN }}

      - name: Clone qemu-ios at pinned commit
        if: steps.qemu-src-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/samhenrigold/qemu-ios qemu-src
          cd qemu-src
          git fetch --depth 1 origin "$QEMU_PIN"
          git checkout "$QEMU_PIN"

      # Runs on both paths: on a cache hit the tree may still carry patches
      # from the previous run, so force-checkout the pin (reverts tracked-file
      # modifications) and make sure the pinned commit object is present.
      - name: Ensure pinned qemu-ios commit
        run: |
          cd qemu-src
          git rev-parse --verify --quiet "$QEMU_PIN^{commit}" >/dev/null || git fetch --depth 1 origin "$QEMU_PIN"
          git checkout -f "$QEMU_PIN"

      - name: Apply no-FFmpeg link fix
        run: |
          cd qemu-src
          cat > amc-nonavcodec-fix.patch <<'PATCH_EOF'
          diff --git a/hw/arm/ipod_touch_amc.c b/hw/arm/ipod_touch_amc.c
          index d833085..1776a09 100644
          --- a/hw/arm/ipod_touch_amc.c
          +++ b/hw/arm/ipod_touch_amc.c
          @@ -144,6 +144,35 @@ static bool amc_trace(void)
           #define AMCT(fmt, ...) do { if (amc_trace()) { \
               TRACE_PRINTF(trace_ipod_touch_amc_log, "[AMC] " fmt, ##__VA_ARGS__); } } while (0)
 
          +/* DMA address helpers: pure range checks, no FFmpeg dependency, so they live
          + * outside the IT_HAVE_AVCODEC guard — amc_engine0() calls them unconditionally. */
          +static bool amc_dram(IPodTouchAMCState *s, uint32_t addr, size_t size)
          +{
          +    return addr >= s->dram_base && addr - s->dram_base < s->dram_size &&
          +           size <= s->dram_size - (addr - s->dram_base);
          +}
          +
          +/* The engine's own memory, the aperture: AMC 2.1's DMA reads only this. */
          +static bool amc_local(IPodTouchAMCState *s, uint32_t addr, size_t size)
          +{
          +    uint32_t limit = s->rev21 ? AMC_APERTURE_21 : AMC_BUF_SIZE;
          +    return addr < limit && size <= limit - addr;
          +}
          +
          +/*
          + * A bank 4 DMA address: bits 1:0 of a descriptor pointer tag its space,
          + * 1 = system memory, 2 = engine-local (7B500 c06e99f8). Returns the physical
          + * address, or -1 when it is not inside that space.
          + */
          +static hwaddr amc_dma_addr(IPodTouchAMCState *s, bool local, uint32_t addr,
          +                           size_t size)
          +{
          +    if (local) {
          +        return amc_local(s, addr, size) ? s->buf_base + addr : -1;
          +    }
          +    return amc_dram(s, addr, size) ? addr : -1;
          +}
          +
           #ifdef IT_HAVE_AVCODEC
           /* ponytail: HLE of the 7E18 AAC-LC/HE-AAC, MP3 and ALAC decoder programs, and of any
            * other program whose stream parameters are AAC's (amc_aac_rate). Other DE programs
          @@ -322,33 +351,6 @@ static void amc_decoder_close(IPodTouchAMCState *s)
               }
           }
 
          -static bool amc_dram(IPodTouchAMCState *s, uint32_t addr, size_t size)
          -{
          -    return addr >= s->dram_base && addr - s->dram_base < s->dram_size &&
          -           size <= s->dram_size - (addr - s->dram_base);
          -}
          -
          -/* The engine's own memory, the aperture: AMC 2.1's DMA reads only this. */
          -static bool amc_local(IPodTouchAMCState *s, uint32_t addr, size_t size)
          -{
          -    uint32_t limit = s->rev21 ? AMC_APERTURE_21 : AMC_BUF_SIZE;
          -    return addr < limit && size <= limit - addr;
          -}
          -
          -/*
          - * A bank 4 DMA address: bits 1:0 of a descriptor pointer tag its space,
          - * 1 = system memory, 2 = engine-local (7B500 c06e99f8). Returns the physical
          - * address, or -1 when it is not inside that space.
          - */
          -static hwaddr amc_dma_addr(IPodTouchAMCState *s, bool local, uint32_t addr,
          -                           size_t size)
          -{
          -    if (local) {
          -        return amc_local(s, addr, size) ? s->buf_base + addr : -1;
          -    }
          -    return amc_dram(s, addr, size) ? addr : -1;
          -}
          -
           static void amc_decode_fail(IPodTouchAMCState *s)
           {
               AMCDecoder *d = s->decoder;
          PATCH_EOF
          sed -i 's/\r$//' amc-nonavcodec-fix.patch
          git apply --check amc-nonavcodec-fix.patch
          git apply amc-nonavcodec-fix.patch

      - name: Apply Windows portability fixes
        run: |
          cd qemu-src
          cat > win32-portability.patch <<'PATCH_EOF'
          diff --git a/hw/arm/ipod_touch_1g.c b/hw/arm/ipod_touch_1g.c
          index 31fa6c7..07e72ec 100644
          --- a/hw/arm/ipod_touch_1g.c
          +++ b/hw/arm/ipod_touch_1g.c
          @@ -363,6 +363,33 @@ static void n45_write32(IPodTouch1GMachineState *s, hwaddr addr, uint32_t v)
            * Whether this iBoot has the check at all: iBoot-159 (1.0) predates the
            * epoch, so finding none in it is no warning. Its panic string is the test.
            */
          +/*
          + * Windows portability: memmem() is a GNU extension missing from MS UCRT.
          + * Tiny local replacement, only compiled on Windows.
          + */
          +#ifdef _WIN32
          +static void *portable_memmem(const void *haystack, size_t haystacklen,
          +                             const void *needle, size_t needlelen)
          +{
          +    const unsigned char *h = haystack, *n = needle;
          +    size_t i;
          +
          +    if (needlelen == 0) {
          +        return (void *)haystack;
          +    }
          +    if (haystacklen < needlelen) {
          +        return NULL;
          +    }
          +    for (i = 0; i + needlelen <= haystacklen; i++) {
          +        if (h[i] == n[0] && memcmp(h + i, n, needlelen) == 0) {
          +            return (void *)(h + i);
          +        }
          +    }
          +    return NULL;
          +}
          +#define memmem portable_memmem
          +#endif
