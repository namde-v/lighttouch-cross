# Standalone launch smoke test for the portable Windows ZIP.
#
# Proves the ZIP runs, not just packages: a FRESH windows-latest runner
# (no Qt installed — this job deliberately has no install-qt step)
# downloads the portable ZIP from a windows-package run, extracts it,
# and launches LightTouch.exe from the extracted layout.
#
# Why offscreen + mock: the runner has no display session, so the app
# runs under QT_QPA_PLATFORM=offscreen; LTM_BRIDGE_MOCK=1 boots the app
# without libLTAppCore, which is exactly the Qt-runtime + QML proof:
# a missing DLL kills the process instantly (0xC0000135), a QML load
# failure exits via main.cpp's failure path, so a process that is still
# alive after 25s with Qt6Core.dll loaded FROM THE LAYOUT DIR is a
# running app. The exe is a WIN32-subsystem app, so redirected stdout
# is expected to be empty — aliveness + loaded modules are the signal,
# not log lines. A non-mock launch attempt runs second, non-gating,
# and its outcome is recorded (it exercises the real core-DLL path).
#
# Crash-dump capture: the real-core launch runs with procdump
# attached (-ma -e, immediately after launch), so an unhandled
# exception in the real core (e.g. the 0xC0000374 heap corruption on
# smoke 40413923104, which left only an exit code) writes a full
# minidump to smoke-dumps/, uploaded as the standalone-smoke-dumps
# artifact (always, warn if none). The mock launch is untouched:
# its gating proof (alive + Qt6Core from layout) is unchanged.
# procdump is installed by its own step (choco, Sysinternals
# fallback — same as windows-ci.yml); if install fails, the run
# still proves aliveness but logs loudly that no dump was captured.
#
# Full page heap: the real-core launch also runs under full page heap
# (IFEO GlobalFlag 0x02000000 + PageHeapFlags 0x01 — the registry
# equivalent of `gflags /p /enable LightTouch.exe /full`, used when
# gflags.exe itself is absent from the runner image). Why: the
# 0xC0000374 dump from smoke 40427508752 identifies the DETECTING
# free (C-runtime free from core code on a Swift Task worker), not
# the corrupting write. Full page heap puts a guard page at the end
# of every allocation, so the corrupting write faults IMMEDIATELY at
# the write, and procdump captures the culprit stack instead of a
# later detecting free. This is FORWARD-overrun detection only
# (standard full page heap); if a pageheap run still reports
# corruption at free time, a backward overrun is the next hypothesis
# (PageHeapFlags 0x10). Page heap is per-image (LightTouch.exe) and
# read at process start, so the step runs AFTER the mock launch
# (mock stays uninstrumented) and BEFORE the real launch. The runner
# is ephemeral, so no cleanup step is needed. Cost: one extra page
# per allocation — acceptable for a 20s smoke run.
#
# Dump on terminate (-t): procdump attaches with -e (unhandled
# exception) AND -t (process terminate, whatever the path). -t is
# required because the 0xC0000421 (STATUS_VERIFIER_STOP) exits on the
# two pageheap runs produced zero dumps with -e alone — the process
# exits without an unhandled exception reaching the debugger. The
# -t dump on the alive path is a healthy-state dump (expected, not a
# crash); on the exited path it is the terminating-state evidence.
# The step waits for the procdump process to finish writing (up to
# 90s) before the upload step runs, so no partial dump is uploaded.
#
# First-chance filtered capture (-e 1 -f C0000421): the -t dump on
# smoke 40445160449 came too late (only 1 parked thread left, no
# faulting stack), so -t alone cannot name the culprit. -e 1 -f
# C0000421 dumps at the verifier stop ITSELF, first-chance, with the
# faulting stack + heap block; -t stays as fallback. Caveat: if -f
# does not match native codes on this procdump version, the next
# refinement is unfiltered -e 1 (first first-chance dump, possibly
# benign — inspect and refine).
#
# Dispatch-only: gh workflow run windows-standalone-smoke.yml
#   --ref win/w-app-smoke [-f package_run_id=<id>|latest]

name: Windows standalone smoke test

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: "Windows package run id to smoke-test (default: latest successful run on main)"
        required: false
        default: "latest"

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Launch portable ZIP standalone
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve package run id
        id: pkg
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          if ($env:INPUT_RUN_ID -and $env:INPUT_RUN_ID -ne 'latest') {
            $runId = $env:INPUT_RUN_ID
            $run = gh api repos/namde-v/lighttouch-cross/actions/runs/$runId --jq '{conclusion: .conclusion, head_branch: .head_branch}' | ConvertFrom-Json
            if ($run.conclusion -ne 'success') { Write-Error "package run $runId is not successful ($($run.conclusion))"; exit 1 }
          } else {
            $runId = gh api repos/namde-v/lighttouch-cross/actions/workflows/windows-package.yml/runs --jq '[.workflow_runs[] | select(.head_branch == "main" and .status == "completed" and .conclusion == "success")] | first | .id'
            if (-not $runId) { Write-Error 'no successful windows-package run on main'; exit 1 }
          }
          "run_id=$runId" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "package run: $runId"

      - name: Download + extract portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_RUN_ID: ${{ steps.pkg.outputs.run_id }}
        run: |
          $artId = gh api repos/namde-v/lighttouch-cross/actions/runs/$env:PKG_RUN_ID/artifacts --jq '.artifacts[] | select(.name == "lighttouch-windows-x86_64-portable") | .id'
          if (-not $artId) { Write-Error 'portable ZIP artifact not found on that package run'; exit 1 }
          gh api repos/namde-v/lighttouch-cross/actions/artifacts/$artId/zip --method GET > portable-artifact.zip
          Expand-Archive portable-artifact.zip -DestinationPath artifact-out -Force
          Expand-Archive artifact-out/LightTouch-windows-x86_64.zip -DestinationPath extracted -Force
          if (-not (Test-Path extracted/LightTouch/LightTouch.exe)) { Write-Error 'LightTouch.exe missing from ZIP'; exit 1 }
          if (-not (Test-Path extracted/LightTouch/Qt6Core.dll)) { Write-Error 'Qt6Core.dll missing from ZIP'; exit 1 }
          if (-not (Test-Path extracted/LightTouch/platforms/qwindows.dll)) { Write-Error 'platforms/qwindows.dll missing from ZIP'; exit 1 }
          if (-not (Test-Path extracted/LightTouch/platforms/qoffscreen.dll)) { Write-Error 'platforms/qoffscreen.dll missing from ZIP (headless launch needs it; Gap 3 stages it from the Qt install)'; exit 1 }
          Write-Host '--- platforms/ in ZIP ---'
          Get-ChildItem extracted/LightTouch/platforms | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "--- Qt6 DLLs: $((Get-ChildItem extracted/LightTouch -Filter Qt6*.dll).Count) ---"

      - name: Launch (mock bridge, offscreen) — GATING
        id: mock
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:LTM_BRIDGE_MOCK = '1'
          $p = Start-Process -FilePath extracted/LightTouch/LightTouch.exe -WorkingDirectory extracted/LightTouch -PassThru -NoNewWindow -RedirectStandardOutput smoke-mock-stdout.txt -RedirectStandardError smoke-mock-stderr.txt
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          "alive=$alive" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($alive) {
            $mods = @(Get-Process -Id $p.Id -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Modules -ErrorAction SilentlyContinue | Where-Object { $_.FileName -like '*Qt6Core.dll*' })
            $fromLayout = @($mods | Where-Object { $_.FileName -like '*extracted*' }).Count -gt 0
            Write-Host "MOCK LAUNCH: process $($p.Id) ALIVE after 25s; Qt6Core loaded from layout: $fromLayout"
            $mods | ForEach-Object { Write-Host "  loaded: $($_.FileName)" }
            if (-not $fromLayout) { Write-Error 'Qt6Core.dll NOT loaded from the extracted layout'; Stop-Process -Id $p.Id -Force; exit 1 }
            Stop-Process -Id $p.Id -Force
          } else {
            $code = $p.ExitCode
            Write-Error "MOCK LAUNCH: process EXITED early, exit code $code (0xC0000135 = missing DLL, 0xC0000005 = access violation)"
            exit 1
          }

      - name: Install procdump (crash-dump capture for the real-core launch)
        id: procdump
        run: |
          # procdump is NOT preinstalled on the windows-latest runner image.
          # Same two-method install as windows-ci.yml (choco, then direct
          # Sysinternals download). Soft-fail by design: the smoke run still
          # proves mock/real aliveness without it, but the real launch then
          # runs WITHOUT dump capture and the log says so loudly.
          $available = $false
          if (Get-Command procdump -ErrorAction SilentlyContinue) {
            Write-Host "procdump already on PATH"
            $available = $true
          } else {
            try {
              choco install procdump -y --no-progress 2>&1 | Select-Object -Last 3 | Write-Host
              if (Get-Command procdump -ErrorAction SilentlyContinue) { $available = $true }
            } catch { Write-Host "choco install failed (non-fatal): $_" }
            if (-not $available) {
              Write-Host "Falling back to direct Sysinternals download..."
              try {
                $zip = Join-Path $env:RUNNER_TEMP "procdump.zip"
                $dir = Join-Path $env:RUNNER_TEMP "procdump"
                Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $zip
                Expand-Archive -Path $zip -DestinationPath $dir -Force
                $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
                $env:PATH = "$dir;$env:PATH"
                if (Get-Command procdump -ErrorAction SilentlyContinue) { $available = $true }
              } catch { Write-Host "Sysinternals download failed (non-fatal): $_" }
            }
          }
          if ($available) {
            & procdump -accepteula -? 2>&1 | Select-Object -First 2 | Write-Host
            Write-Host "procdump ready"
          } else {
            Write-Host "WARNING: procdump unavailable — real-core launch will run WITHOUT crash-dump capture"
          }
          "available=$($available.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Enable full pageheap for LightTouch.exe
        id: pageheap
        run: |
          # Full page heap for the real-core launch ONLY (this step runs
          # after the mock launch, so mock stays uninstrumented). Goal: the
          # corrupting write faults immediately at the write, so procdump
          # captures the culprit stack — the 0xC0000374 dump only showed
          # the detecting free, not the corrupting write.
          # Method: gflags if present, else direct registry (verified
          # values — GlobalFlag MUST be REG_SZ, a string, not a DWORD):
          #   HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File
          #     Execution Options\LightTouch.exe
          #     GlobalFlag (REG_SZ) = "0x02000000" (FLG_HEAP_PAGE_ALLOCATION)
          #     PageHeapFlags (REG_DWORD) = 1 (enable page heap)
          # Equivalent to `gflags /p /enable LightTouch.exe /full`.
          # Soft-fail by design: without pageheap the run still yields a
          # procdump dump (as before), but the log says loudly that the
          # corrupting write will NOT fault immediately.
          $enabled = $false
          $gflags = Get-Command gflags -ErrorAction SilentlyContinue
          if (-not $gflags) {
            foreach ($cand in @(
              'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\gflags.exe',
              'C:\Program Files\Windows Kits\10\Debuggers\x64\gflags.exe')) {
              if (Test-Path $cand) { $gflags = $cand; break }
            }
          }
          if ($gflags) {
            Write-Host "gflags found: $gflags"
            try {
              & $gflags /p /enable LightTouch.exe /full 2>&1 | Write-Host
              $enabled = $true
            } catch { Write-Host "gflags /p /enable failed (non-fatal): $_" }
          }
          if (-not $enabled) {
            Write-Host "gflags unavailable — enabling full pageheap via registry..."
            try {
              $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\LightTouch.exe'
              New-Item -Path $key -Force | Out-Null
              Set-ItemProperty -Path $key -Name 'GlobalFlag' -Value '0x02000000' -Type String -Force
              Set-ItemProperty -Path $key -Name 'PageHeapFlags' -Value 1 -Type DWord -Force
              $enabled = $true
            } catch { Write-Host "registry pageheap enable failed (non-fatal): $_" }
          }
          # Verify by reading back (this is the proof the run was instrumented).
          # Note: gflags /p /enable /full sets PageHeapFlags 0x3 (bit 0 =
          # enable page heap, bit 1 = collect stack traces), while the
          # registry fallback sets 1. Both are full page heap — so check
          # bit 0, not exact equality (an exact `== 1` check falsely
          # reports "NOT enabled" on a gflags-enabled run, as happened
          # on smoke 40436685652, where gflags confirmed "page heap
          # enabled" yet the step warned NOT enabled).
          try {
            $props = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\LightTouch.exe' -ErrorAction Stop
            Write-Host "pageheap read-back: GlobalFlag=$($props.GlobalFlag) PageHeapFlags=$($props.PageHeapFlags)"
            if ($props.GlobalFlag -ne '0x02000000' -or ($props.PageHeapFlags -band 1) -ne 1) { $enabled = $false }
          } catch { Write-Host "pageheap read-back failed (non-fatal): $_"; $enabled = $false }
          if ($enabled) {
            Write-Host "full pageheap ENABLED for LightTouch.exe"
          } else {
            Write-Host "WARNING: full pageheap NOT enabled — real-core launch runs with procdump capture only"
          }
          "enabled=$($enabled.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Launch (real core path, offscreen) — NON-GATING, recorded
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          Remove-Item Env:LTM_BRIDGE_MOCK -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath extracted/LightTouch/LightTouch.exe -WorkingDirectory extracted/LightTouch -PassThru -NoNewWindow -RedirectStandardOutput smoke-real-stdout.txt -RedirectStandardError smoke-real-stderr.txt
          # Crash-dump capture: attach procdump to the real-core process so a
          # crash writes a full minidump (-ma) to smoke-dumps/ instead of
          # vanishing with only an exit code. -e 1 -f C0000421 = dump on the
          # FIRST-CHANCE verifier-stop exception (STATUS_VERIFIER_STOP,
          # 0xC0000421) — the faulting stack + heap block at the stop
          # itself. -t = dump on process terminate, whatever the path
          # (fallback: the -t dump on smoke 40445160449 came too late —
          # only 1 parked thread left, no faulting stack — so -t alone
          # cannot name the culprit). Caveat: if -f does not match native
          # codes on this procdump version, the next refinement is
          # unfiltered -e 1 (first first-chance dump, possibly benign —
          # inspect and refine); that fallback is NOT implemented here.
          # Attach immediately: the crash takes seconds (Qt + core init +
          # QML load), procdump attaches in <1s. The procdump process
          # object is kept so the step can wait for the dump write to
          # finish before reporting/uploading (a full -ma dump takes ~20s
          # to write; without the wait the upload step could race a
          # partial dump). Note: with -e 1, procdump keeps monitoring
          # after a first-chance dump and exits only when the process
          # terminates (when -t fires), so the wait logic below still
          # applies unchanged.
          $dumpArmed = $false
          $pd = $null
          if ('${{ steps.procdump.outputs.available }}' -eq 'true') {
            New-Item -ItemType Directory -Force smoke-dumps | Out-Null
            $pd = Start-Process procdump -ArgumentList "-accepteula -ma -e 1 -f C0000421 -t $($p.Id) smoke-dumps" -NoNewWindow -PassThru
            $dumpArmed = $true
            Write-Host "procdump attached to real-core PID $($p.Id) (dump dir: smoke-dumps, -e -t)"
          } else {
            Write-Host "WARNING: procdump unavailable — real-core launch runs WITHOUT crash-dump capture"
          }
          if ('${{ steps.pageheap.outputs.enabled }}' -eq 'true') {
            Write-Host "full pageheap ENABLED for this launch (corrupting write will fault immediately; procdump captures the culprit stack)"
          } else {
            Write-Host "WARNING: full pageheap NOT enabled for this launch (heap corruption, if any, will surface as a later detecting free, as before)"
          }
          Start-Sleep -Seconds 20
          $wasAlive = -not $p.HasExited
          if ($wasAlive) {
            Write-Host "REAL LAUNCH: process $($p.Id) ALIVE after 20s (core path works standalone)"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "REAL LAUNCH: process EXITED early, exit code $($p.ExitCode) — recorded, not gating (mock launch is the Qt-runtime proof)"
          }
          if ($dumpArmed) {
            # Wait for procdump to finish writing before reporting/uploading.
            # On the alive path, -t starts writing only after the stop above;
            # on the exited path the write may still be in progress if death
            # was recent. Without this wait the upload step can race a
            # partial dump (the 2s sleep it replaced was not enough for a
            # ~340MB full dump).
            if ($pd) {
              try { Wait-Process -Id $pd.Id -Timeout 90 -ErrorAction Stop } catch { Write-Host "procdump still writing after 90s (upload proceeds with whatever exists)" }
            } else {
              Start-Sleep -Seconds 2
            }
            $dumps = @(Get-ChildItem smoke-dumps -Filter *.dmp -ErrorAction SilentlyContinue)
            if ($dumps.Count -gt 0) {
              if ($wasAlive) {
                $dumps | ForEach-Object { Write-Host "PROCESS DUMP CAPTURED (healthy-state, expected — process was alive when stopped, NOT a crash): $($_.FullName) ($($_.Length) bytes)" }
              } else {
                # Exited path: with -e 1 -f C0000421, the EARLIEST dump is
                # the first-chance verifier-stop capture (the gold — faulting
                # stack + heap block); any LATER dump is the -t terminate
                # dump (late, parked thread only, as on 40445160449).
                $dumps | Sort-Object CreationTime | ForEach-Object { Write-Host "DUMP CAPTURED (exited path — earliest = first-chance verifier-stop capture if present, later = -t terminate dump): $($_.FullName) ($($_.Length) bytes)" }
              }
            } else {
              Write-Host "No process dump (procdump unavailable, filter did not match, or write did not complete)"
            }
          }

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke-dumps
          path: smoke-dumps/*.dmp
          if-no-files-found: warn

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke-logs
          path: smoke-*.txt
          if-no-files-found: warn
