# LightTouch cross-platform port — Qt UI tests on Windows (scaffold)
#
# Runs the Qt 6 UI test suite headless via QT_QPA_PLATFORM=offscreen + ctest.
# The runners are the test machines: ctest results (JUnit XML + full log)
# upload as an artifact on EVERY run — pass or fail — so failures are
# diagnosable without a local Windows box.
#
# Ownership split: the Qt UI lives in its own repo (namde-v/lighttouch-ui);
# this file owns the runner wiring. The UI repo is checked out at QtUI/
# (see QT_UI_DIR below) — it must be a CMake project with enable_testing()
# and the QtTest-based tests registered with ctest.
# Trigger note: the UI is a separate repo, so port-repo QtUI/** paths never
# match; this workflow runs on workflow-file edits and manual dispatch until
# a cross-repo trigger (repository_dispatch/schedule) is added (see
# docs/windows-app-wiring-gap.md). The job-level gate below still skips
# (not fails) if the checkout does not yield QtUI/CMakeLists.txt.
name: Windows Qt UI tests

on:
  push:
    branches: [main, port/**, win/**]
    paths:
      - 'QtUI/**'
      - '.github/workflows/windows-qt-ci.yml'
  pull_request:
    paths:
      - 'QtUI/**'
      - '.github/workflows/windows-qt-ci.yml'
  workflow_dispatch:

env:
  QT_UI_DIR: QtUI      # W-UI: adjust if the Qt UI lands elsewhere
  QT_VERSION: "6.8.3"

jobs:
  qt-tests:
    name: Qt tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The Qt UI lives in its own repo — check it out at QtUI/. (The
      # port repo has no QtUI/ directory; the old scaffold waited for one
      # to land here and therefore never ran.)
      - name: Check out Qt UI repo
        uses: actions/checkout@v4
        with:
          repository: namde-v/lighttouch-ui
          path: QtUI

      # Gate: everything below is skipped (not failed) if the UI checkout
      # does not yield QtUI/CMakeLists.txt.
      - name: Check Qt UI sources exist
        id: src
        run: |
          if (Test-Path "${{ env.QT_UI_DIR }}/CMakeLists.txt") {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Warning "QtUI/CMakeLists.txt not present after UI checkout — Qt tests skipped."
          }

      - name: Install Qt
        if: steps.src.outputs.present == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      # Qt is installed for MSVC (win64_msvc2022_64) but Ninja otherwise
      # defaults to the MinGW gcc on PATH — that mismatch produced a wall
      # of undefined Qt symbols at link time (run 40226999464: configure
      # picked "GNU 15.2.0", every Qt symbol unresolved). Set up the MSVC
      # environment so CMake picks cl.exe.
      - name: Set up MSVC environment
        if: steps.src.outputs.present == 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        if: steps.src.outputs.present == 'true'
        run: cmake -S ${{ env.QT_UI_DIR }} -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.src.outputs.present == 'true'
        run: cmake --build build

      # The build also produces the app executable (build/lighttouch.exe
      # under the Ninja generator). Upload it under the artifact name the
      # package workflow expects — evidence the exe compiles on Windows.
      # NOTE: the package step downloads from the WINDOWS-CI run id, so
      # this artifact is NOT yet consumable by packaging (see
      # docs/windows-app-wiring-gap.md gap 2); warn, never fail, if absent.
      - name: Upload Qt UI executable (if built)
        if: steps.src.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighttouch-qt-ui-windows-x86_64
          path: build/lighttouch.exe
          if-no-files-found: warn
          retention-days: 30

      # NOTE: no QT_QPA_PLATFORM=offscreen here — deliberately. The UI
      # repo's own windows-ci.yml runs this suite 17/17 green on
      # windows-latest with the DEFAULT platform plugin, and offscreen on
      # Windows is the prime suspect for the 5 failures of run 40229752935
      # (isExposed() never true, scene-graph/texture paths with no real
      # window, one segfault in tst_surface11). If this run still fails,
      # the next hypothesis is the VS generator (the UI repo's workflow
      # uses the default Visual Studio generator, not Ninja).
      - name: Test
        if: steps.src.outputs.present == 'true'
        run: |
          ctest --test-dir build --output-on-failure --output-junit test-results.xml 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always() && steps.src.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qt-ui-tests-windows-x86_64
          path: |
            test-results.xml
            ctest.log
          if-no-files-found: warn
          retention-days: 30
