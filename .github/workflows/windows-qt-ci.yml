# LightTouch cross-platform port — Qt UI tests on Windows
#
# Runs the Qt 6 UI test suite via ctest. The build/test steps converge on
# the UI repo's own windows-ci.yml (the known-green reference: 17/17 on
# windows-latest 2026-10-16) — default Visual Studio generator, Release
# config, no workflow-level QT_QPA_PLATFORM (the tests set offscreen
# themselves via tests/CMakeLists.txt set_tests_properties).
#
# Ownership split: the Qt UI lives in its own repo (namde-v/lighttouch-ui);
# this file owns the runner wiring. The UI repo is checked out at QtUI/
# (see QT_UI_DIR below) — it must be a CMake project with enable_testing()
# and the QtTest-based tests registered with ctest.
# Trigger note: the UI is a separate repo, so port-repo QtUI/** paths never
# match; this workflow runs on workflow-file edits and manual dispatch until
# a cross-repo trigger (repository_dispatch/schedule) is added (see
# docs/windows-app-wiring-gap.md). The job-level gate below still skips
# (not fails) if the checkout does not yield QtUI/CMakeLists.txt.
name: Windows Qt UI tests

on:
  push:
    branches: [main, port/**, win/**]
    paths:
      - 'QtUI/**'
      - '.github/workflows/windows-qt-ci.yml'
  pull_request:
    paths:
      - 'QtUI/**'
      - '.github/workflows/windows-qt-ci.yml'
  workflow_dispatch:

env:
  QT_UI_DIR: QtUI      # W-UI: adjust if the Qt UI lands elsewhere
  QT_VERSION: "6.8.3"

jobs:
  qt-tests:
    name: Qt tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The Qt UI lives in its own repo — check it out at QtUI/. (The
      # port repo has no QtUI/ directory; the old scaffold waited for one
      # to land here and therefore never ran.)
      - name: Check out Qt UI repo
        uses: actions/checkout@v4
        with:
          repository: namde-v/lighttouch-ui
          path: QtUI

      # Gate: everything below is skipped (not failed) if the UI checkout
      # does not yield QtUI/CMakeLists.txt.
      - name: Check Qt UI sources exist
        id: src
        run: |
          if (Test-Path "${{ env.QT_UI_DIR }}/CMakeLists.txt") {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Warning "QtUI/CMakeLists.txt not present after UI checkout — Qt tests skipped."
          }

      - name: Install Qt
        if: steps.src.outputs.present == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      # Default Visual Studio generator (no -G Ninja): this matches the
      # UI repo's own windows-ci.yml, the known-green reference. The
      # Ninja build was the remaining setup difference after the
      # offscreen hypothesis was ruled out (run 40234747319 failed the
      # same 5 tests with the default platform plugin — and the tests set
      # QT_QPA_PLATFORM=offscreen themselves via set_tests_properties,
      # so the workflow env never mattered). The VS generator also needs
      # no msvc-dev-cmd: CMake finds MSVC itself.
      - name: Configure
        if: steps.src.outputs.present == 'true'
        run: cmake -S ${{ env.QT_UI_DIR }} -B build

      - name: Build
        if: steps.src.outputs.present == 'true'
        run: cmake --build build --config Release --parallel

      # The build also produces the app executable (build/Release/
      # lighttouch.exe under the VS generator). Upload it under the
      # artifact name the package workflow expects — evidence the exe
      # compiles on Windows. NOTE: it is NOT yet consumable by packaging
      # until the gap 2 decision is implemented (see
      # docs/windows-app-wiring-gap.md); warn, never fail, if absent.
      - name: Upload Qt UI executable (if built)
        if: steps.src.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighttouch-qt-ui-windows-x86_64
          path: build/Release/lighttouch.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Test
        if: steps.src.outputs.present == 'true'
        run: ctest --test-dir build -C Release --output-on-failure

      # Bring-up diagnostics, copied from the UI repo's workflow: rerun
      # failures verbosely so the raw test output (or loader errors) is
      # visible in the log. The plain ctest summary hides the failure
      # lines for these tests (no FAIL! lines, no output at all).
      - name: Diagnose failures
        if: failure()
        continue-on-error: true
        run: |
          ctest --test-dir build -C Release --rerun-failed -V 2>&1 | Select-Object -First 250
