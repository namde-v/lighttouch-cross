# LightTouch cross-platform port — Linux CI
#
# On every push/PR: builds and unit-tests each portable Swift package under
# Packages/ on Ubuntu 24.04, keeping Linux in lockstep with the Windows CI.
#
# Toolchain: official swift.org tarball, pinned to SWIFT_VERSION (same version
# used for local development; see docs/SWIFT_TOOLCHAIN.md in the project notes).
# NOTE: swift-actions/setup-swift is intentionally NOT used — its hardcoded
# version list lags behind swift.org releases.
name: Linux CI

on:
  push:
    branches: [main, port/**]
  pull_request:

env:
  SWIFT_VERSION: "6.4.1"

jobs:
  build-and-test:
    name: swift build + test (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package:
          - HostRuntime
          - DeviceServices
          - ReleaseChecks
          - BuildTools
          - FirmwareKit
          - DeviceRuntime
          - LightTouchCore
    defaults:
      run:
        working-directory: Packages/${{ matrix.package }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev pkg-config

      - name: Install Swift
        run: |
          curl -fsSL -o /tmp/swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          sudo tar xzf /tmp/swift.tar.gz --directory / --strip-components=1
          rm /tmp/swift.tar.gz

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --configuration release

      # Note: --skip-build is intentionally NOT used. `swift build --build-tests`
      # does not produce testing-enabled library objects, so a skipped build
      # fails with "module was not compiled for testing". A plain `swift test`
      # builds everything correctly (incrementally reusing the Build step).
      - name: Test
        run: swift test --configuration release
