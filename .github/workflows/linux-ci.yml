# LightTouch cross-platform port — Linux CI
#
# On every push/PR: builds and unit-tests each portable Swift package under
# Packages/ on Ubuntu 24.04, keeping Linux in lockstep with the Windows CI.
#
# Toolchain is pinned to the same Swift version used for local development
# (see docs/SWIFT_TOOLCHAIN.md).
name: Linux CI

on:
  push:
    branches: [main, port/**]
  pull_request:

env:
  SWIFT_VERSION: "6.2.1"

jobs:
  build-and-test:
    name: swift build + test (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package:
          - HostRuntime
          - DeviceServices
          - ReleaseChecks
          - BuildTools
          - FirmwareKit
          - DeviceRuntime
          - LightTouchCore
    defaults:
      run:
        working-directory: Packages/${{ matrix.package }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev pkg-config

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --configuration release

      - name: Test
        run: swift test --skip-build
